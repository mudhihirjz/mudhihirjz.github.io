<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Media · New Class</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f17;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* header */
    .media-header {
      background: #12121f;
      padding: 1.2rem 2rem;
      border-bottom: 3px solid #ff8c42;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .media-header .logo-area {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .media-header .logo-area h2 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(to right, #ff8c42, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .back-home {
      background: rgba(255, 140, 66, 0.15);
      border: 1px solid #ff8c42;
      color: #ff8c42;
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      transition: 0.25s ease;
      font-size: 0.95rem;
    }

    .back-home:hover {
      background: #ff8c42;
      color: #0a0a10;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 140, 66, 0.4);
    }

    /* filter / search */
    .media-toolbar {
      background: #1a1a28;
      padding: 1.2rem 2rem;
      border-bottom: 1px solid rgba(255, 140, 66, 0.2);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .filter-buttons {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .filter-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 140, 66, 0.2);
      color: #b0b0c8;
      padding: 0.4rem 1.2rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .filter-btn.active-filter {
      background: #ff8c42;
      color: #0a0a10;
      border-color: #ff8c42;
    }

    .filter-btn:hover {
      background: #ff8c42;
      color: #0a0a10;
    }

    .search-media {
      display: flex;
      background: #252536;
      border-radius: 2.5rem;
      border: 1px solid rgba(255, 140, 66, 0.2);
      overflow: hidden;
      max-width: 320px;
      width: 100%;
    }

    .search-media input {
      flex: 1;
      padding: 0.5rem 1.2rem;
      background: transparent;
      border: none;
      color: #f0f0f0;
      outline: none;
      font-size: 0.9rem;
      min-width: 100px;
    }

    .search-media input::placeholder {
      color: #77778f;
    }

    .search-media button {
      background: #ff8c42;
      border: none;
      padding: 0 1.2rem;
      color: #0a0a10;
      cursor: pointer;
      font-size: 1rem;
    }

    /* grid */
    .media-grid-container {
      padding: 2rem 2rem 3rem 2rem;
      flex: 1;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 2rem;
    }

    /* media card */
    .media-card {
      background: #1e1e30;
      border-radius: 2rem;
      overflow: hidden;
      border: 1px solid rgba(255, 140, 66, 0.15);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .media-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px rgba(255, 140, 66, 0.2);
      border-color: rgba(255, 140, 66, 0.4);
    }

    .media-preview {
      height: 210px;
      background-size: cover;
      background-position: center;
      background-color: #2a2a3e;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-preview .play-overlay {
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(6px);
      border-radius: 50%;
      width: 56px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      color: #ff8c42;
      border: 2px solid rgba(255, 140, 66, 0.6);
    }

    .media-preview .media-type-badge {
      position: absolute;
      top: 0.8rem;
      left: 0.8rem;
      background: rgba(255, 140, 66, 0.85);
      padding: 0.25rem 1rem;
      border-radius: 2rem;
      font-size: 0.7rem;
      font-weight: 700;
      color: #0a0a10;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .media-info {
      padding: 1.2rem 1.2rem 1rem 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .media-info h3 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
      color: #f0e6ff;
    }

    .media-info .meta {
      font-size: 0.8rem;
      color: #8888a0;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin-bottom: 0.6rem;
    }

    .media-info .description {
      font-size: 0.9rem;
      color: #b0b0c8;
      line-height: 1.5;
      margin-bottom: 1rem;
    }

    /* action row: share + download */
    .media-actions {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-top: auto;
    }

    .action-btn {
      flex: 1 0 auto;
      min-width: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      padding: 0.5rem 0.8rem;
      border-radius: 2.5rem;
      border: none;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      color: #f0f0f0;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .action-btn i {
      font-size: 1rem;
    }

    .action-btn.download-btn {
      background: #2d8cff;
      color: white;
      border-color: #2d8cff;
    }
    .action-btn.download-btn:hover {
      background: #1a7aee;
      transform: scale(1.04);
    }

    .action-btn.share-wa {
      background: #25d366;
      color: #0a0a10;
      border-color: #25d366;
    }
    .action-btn.share-wa:hover {
      background: #20b85a;
      transform: scale(1.04);
    }

    .action-btn.share-fb {
      background: #1877f2;
      color: white;
      border-color: #1877f2;
    }
    .action-btn.share-fb:hover {
      background: #0e6bd4;
      transform: scale(1.04);
    }

    .action-btn.share-ig {
      background: #d62976;
      color: white;
      border-color: #d62976;
    }
    .action-btn.share-ig:hover {
      background: #c01e66;
      transform: scale(1.04);
    }

    .no-results {
      text-align: center;
      padding: 3rem 0;
      color: #aaaac0;
      font-size: 1.2rem;
      grid-column: 1 / -1;
    }

    /* responsive */
    @media (max-width: 700px) {
      .media-header {
        flex-direction: column;
        align-items: flex-start;
        padding: 1rem 1.5rem;
      }
      .media-toolbar {
        flex-direction: column;
        align-items: stretch;
        padding: 1rem 1.5rem;
      }
      .search-media {
        max-width: 100%;
      }
      .media-grid-container {
        padding: 1.5rem 1rem 2rem 1rem;
      }
      .media-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1.5rem;
      }
      .action-btn {
        font-size: 0.7rem;
        padding: 0.4rem 0.6rem;
        min-width: 38px;
      }
      .action-btn i {
        font-size: 0.85rem;
      }
    }

    @media (max-width: 480px) {
      .media-grid {
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .media-preview {
        height: 150px;
      }
      .media-info h3 {
        font-size: 1rem;
      }
      .media-actions {
        gap: 0.4rem;
      }
      .action-btn {
        font-size: 0.6rem;
        padding: 0.3rem 0.4rem;
        min-width: 32px;
      }
      .action-btn i {
        font-size: 0.7rem;
      }
      .filter-btn {
        font-size: 0.7rem;
        padding: 0.2rem 0.8rem;
      }
    }

    @media (max-width: 380px) {
      .media-grid {
        grid-template-columns: 1fr;
      }
    }

    .footer-note {
      background: #0f0f1a;
      padding: 1rem 2rem;
      text-align: center;
      border-top: 1px solid rgba(255, 140, 66, 0.15);
      font-size: 0.85rem;
      color: #77778f;
      margin-top: auto;
    }
    .footer-note i {
      color: #ff8c42;
    }
  </style>
</head>
<body>
  <!-- header -->
  <header class="media-header">
    <div class="logo-area">
      <h2><i class="fas fa-photo-video" style="background:transparent; -webkit-text-fill-color:#ff8c42; margin-right:0.3rem;"></i> Media</h2>
      <a href="#" class="back-home" onclick="window.history.back(); return false;">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>
    <div style="display:flex; gap:0.8rem; align-items:center;">
      <span style="color:#8888a0; font-size:0.9rem;"><i class="fas fa-download"></i> Download any</span>
    </div>
  </header>

  <!-- toolbar -->
  <div class="media-toolbar">
    <div class="filter-buttons" id="filterButtons">
      <button class="filter-btn active-filter" data-filter="all">All</button>
      <button class="filter-btn" data-filter="image">Images</button>
      <button class="filter-btn" data-filter="video">Videos</button>
      <button class="filter-btn" data-filter="audio">Audio</button>
    </div>
    <div class="search-media">
      <input type="text" id="mediaSearchInput" placeholder="Search media..." />
      <button id="mediaSearchBtn"><i class="fas fa-search"></i></button>
    </div>
  </div>

  <!-- grid -->
  <div class="media-grid-container">
    <div class="media-grid" id="mediaGrid"></div>
  </div>

  <div class="footer-note">
    <i class="fas fa-cloud-download-alt"></i>  click download to save · share via social
  </div>

  <script>
    (function() {
      // ----- media data -----
      const mediaItems = [
        // images
        { id: 1, type: 'image', title: 'Mountain Sunset', description: 'Golden hour over alpine peaks.', file: 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=2070&auto=format&fit=crop', badge: 'photo' },
        { id: 2, type: 'image', title: 'Ocean Waves', description: 'Calming blue waves at sunrise.', file: 'https://images.unsplash.com/photo-1501594907352-04cda38ebc29?q=80&w=1932&auto=format&fit=crop', badge: 'photo' },
        { id: 3, type: 'image', title: 'Forest Canopy', description: 'Dappled light through ancient trees.', file: 'https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=2071&auto=format&fit=crop', badge: 'photo' },
        { id: 4, type: 'image', title: 'Urban Night', description: 'City lights under a starry sky.', file: 'https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=2064&auto=format&fit=crop', badge: 'photo' },
        // videos (using youtube thumbnails + dummy download)
        { id: 5, type: 'video', title: 'Nature 4K', description: 'Soothing nature footage with ambient sound.', file: 'https://img.youtube.com/vi/tgbNymZ7vqY/maxresdefault.jpg', badge: 'video', videoId: 'tgbNymZ7vqY' },
        { id: 6, type: 'video', title: 'City Timelapse', description: 'Fast-paced city life in timelapse.', file: 'https://img.youtube.com/vi/6v2L2UGZJAM/maxresdefault.jpg', badge: 'video', videoId: '6v2L2UGZJAM' },
        { id: 7, type: 'video', title: 'Wildlife Safari', description: 'Animals in their natural habitat.', file: 'https://img.youtube.com/vi/1qHXx5i9LFE/maxresdefault.jpg', badge: 'video', videoId: '1qHXx5i9LFE' },
        // audio
        { id: 8, type: 'audio', title: 'Ambient Chill', description: 'Relaxing electronic beats for focus.', file: 'https://samplelib.com/lib/preview/mp3/sample-3s.mp3', badge: 'audio', audioFile: 'sample-3s.mp3' },
        { id: 9, type: 'audio', title: 'Podcast: Design Talk', description: 'Discussion on modern UI/UX trends.', file: 'https://samplelib.com/lib/preview/mp3/sample-6s.mp3', badge: 'audio', audioFile: 'sample-6s.mp3' },
        { id: 10, type: 'audio', title: 'LoFi Study Beats', description: 'Smooth lo-fi to study or relax.', file: 'https://samplelib.com/lib/preview/mp3/sample-9s.mp3', badge: 'audio', audioFile: 'sample-9s.mp3' },
        // extra images
        { id: 11, type: 'image', title: 'Desert Dunes', description: 'Endless sand dunes at golden hour.', file: 'https://images.unsplash.com/photo-1509316785289-025f5b846b35?q=80&w=2076&auto=format&fit=crop', badge: 'photo' },
        { id: 12, type: 'image', title: 'Aurora Borealis', description: 'Northern lights dancing in the sky.', file: 'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?q=80&w=2070&auto=format&fit=crop', badge: 'photo' }
      ];

      const grid = document.getElementById('mediaGrid');
      let currentFilter = 'all';
      let searchQuery = '';

      // helper: get share url (dummy product link)
      function getMediaUrl(item) {
        return `https://newclass.com/media/${item.id}-${item.title.replace(/\s+/g, '-').toLowerCase()}`;
      }

      // render
      function renderMedia() {
        const filtered = mediaItems.filter(item => {
          // filter
          if (currentFilter !== 'all' && item.type !== currentFilter) return false;
          // search
          if (searchQuery) {
            const q = searchQuery.toLowerCase();
            return item.title.toLowerCase().includes(q) || 
                   item.description.toLowerCase().includes(q) ||
                   item.type.toLowerCase().includes(q);
          }
          return true;
        });

        if (filtered.length === 0) {
          grid.innerHTML = `<div class="no-results"><i class="fas fa-search" style="font-size:2rem; opacity:0.5; display:block; margin-bottom:1rem;"></i> No media found</div>`;
          return;
        }

        let html = '';
        filtered.forEach(item => {
          const mediaUrl = getMediaUrl(item);
          const shareText = `Check out "${item.title}" on New Class Media!`;

          // icon based on type
          let typeIcon = '';
          let playOverlay = '';
          if (item.type === 'video') {
            typeIcon = '<i class="fas fa-play"></i>';
            playOverlay = `<div class="play-overlay">${typeIcon}</div>`;
          } else if (item.type === 'audio') {
            typeIcon = '<i class="fas fa-music"></i>';
            playOverlay = `<div class="play-overlay">${typeIcon}</div>`;
          } else {
            // image: no overlay
            playOverlay = '';
          }

          // badge
          const badgeLabel = item.badge || item.type;

          // download link: for images we use the image url, for video we use youtube url, for audio we use sample mp3
          let downloadUrl = item.file;
          if (item.type === 'video' && item.videoId) {
            downloadUrl = `https://www.youtube.com/watch?v=${item.videoId}`; // fallback
          } else if (item.type === 'audio' && item.audioFile) {
            downloadUrl = item.file; // sample mp3
          }

          html += `
            <div class="media-card" data-id="${item.id}">
              <div class="media-preview" style="background-image: url('${item.file}');">
                <span class="media-type-badge">${badgeLabel}</span>
                ${playOverlay}
              </div>
              <div class="media-info">
                <h3>${item.title}</h3>
                <div class="meta"><i class="fas fa-${item.type === 'image' ? 'image' : item.type === 'video' ? 'video' : 'music'}"></i> ${item.type}</div>
                <div class="description">${item.description}</div>
                <div class="media-actions">
                  <!-- download button -->
                  <a href="${downloadUrl}" download class="action-btn download-btn" target="_blank" rel="noopener">
                    <i class="fas fa-download"></i> <span class="dl-label">Download</span>
                  </a>
                  <!-- share buttons -->
                  <a href="https://wa.me/?text=${encodeURIComponent(shareText + ' ' + mediaUrl)}" target="_blank" class="action-btn share-wa">
                    <i class="fab fa-whatsapp"></i>
                  </a>
                  <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(mediaUrl)}" target="_blank" class="action-btn share-fb">
                    <i class="fab fa-facebook-f"></i>
                  </a>
                  <a href="#" onclick="alert('Copy this link to share on Instagram: ${mediaUrl}'); return false;" class="action-btn share-ig">
                    <i class="fab fa-instagram"></i>
                  </a>
                </div>
              </div>
            </div>
          `;
        });

        grid.innerHTML = html;
      }

      // filter buttons
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          filterBtns.forEach(b => b.classList.remove('active-filter'));
          this.classList.add('active-filter');
          currentFilter = this.dataset.filter;
          renderMedia();
        });
      });

      // search
      const searchInput = document.getElementById('mediaSearchInput');
      const searchBtn = document.getElementById('mediaSearchBtn');

      function handleMediaSearch() {
        searchQuery = searchInput.value.trim();
        renderMedia();
      }

      searchBtn.addEventListener('click', handleMediaSearch);
      searchInput.addEventListener('keyup', (e) => {
        if (e.key === 'Enter') handleMediaSearch();
      });

      // initial render
      renderMedia();

      // responsive: hide label on small screens
      function adjustLabels() {
        const labels = document.querySelectorAll('.dl-label');
        const isSmall = window.innerWidth < 500;
        labels.forEach(label => {
          label.style.display = isSmall ? 'none' : 'inline';
        });
      }
      window.addEventListener('resize', adjustLabels);
      adjustLabels();

      console.log('Media page loaded with download + share.');
    })();
  </script>
</body>
</html>
