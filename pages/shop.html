<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shop · New Class</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f17;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* header / nav back */
    .shop-header {
      background: #12121f;
      padding: 1.2rem 2rem;
      border-bottom: 3px solid #ff8c42;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .shop-header .logo-area {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .shop-header .logo-area h2 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(to right, #ff8c42, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .back-home {
      background: rgba(255, 140, 66, 0.15);
      border: 1px solid #ff8c42;
      color: #ff8c42;
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      transition: 0.25s ease;
      font-size: 0.95rem;
    }

    .back-home:hover {
      background: #ff8c42;
      color: #0a0a10;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 140, 66, 0.4);
    }

    /* search bar */
    .search-wrapper {
      padding: 1.8rem 2rem 1rem 2rem;
      background: #1a1a28;
      border-bottom: 1px solid rgba(255, 140, 66, 0.2);
    }

    .search-bar {
      max-width: 600px;
      margin: 0 auto;
      display: flex;
      background: #252536;
      border-radius: 3rem;
      border: 1px solid rgba(255, 140, 66, 0.3);
      overflow: hidden;
      transition: box-shadow 0.3s;
    }

    .search-bar:focus-within {
      box-shadow: 0 0 0 3px rgba(255, 140, 66, 0.3);
      border-color: #ff8c42;
    }

    .search-bar input {
      flex: 1;
      padding: 0.9rem 1.5rem;
      background: transparent;
      border: none;
      color: #f0f0f0;
      font-size: 1rem;
      outline: none;
      min-width: 140px;
    }

    .search-bar input::placeholder {
      color: #8888a0;
      font-weight: 300;
    }

    .search-bar button {
      background: #ff8c42;
      border: none;
      padding: 0 1.8rem;
      color: #0a0a10;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: 0.25s;
    }

    .search-bar button:hover {
      background: #ffaa5e;
    }

    /* grid container */
    .shop-grid-container {
      padding: 2rem 2rem 3rem 2rem;
      flex: 1;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 2rem;
    }

    /* product card */
    .product-card {
      background: #1e1e30;
      border-radius: 2rem;
      overflow: hidden;
      border: 1px solid rgba(255, 140, 66, 0.15);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(255, 140, 66, 0.25);
      border-color: rgba(255, 140, 66, 0.4);
    }

    .product-image {
      height: 220px;
      background-size: cover;
      background-position: center;
      background-color: #2a2a3e;
      position: relative;
      display: flex;
      align-items: flex-end;
      justify-content: flex-start;
      padding: 0.8rem;
    }

    .product-image .badge {
      background: rgba(255, 140, 66, 0.9);
      backdrop-filter: blur(4px);
      padding: 0.3rem 1rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      font-weight: 700;
      color: #0a0a10;
      letter-spacing: 0.3px;
      text-transform: uppercase;
    }

    .product-info {
      padding: 1.5rem 1.2rem 1.2rem 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .product-info h3 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
      color: #f0e6ff;
    }

    .product-info .category {
      font-size: 0.85rem;
      color: #aaaac0;
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .product-info .price {
      font-size: 1.2rem;
      font-weight: 700;
      color: #ff8c42;
      margin: 0.5rem 0 1rem 0;
    }

    /* social buttons row */
    .social-actions {
      display: flex;
      gap: 0.7rem;
      flex-wrap: wrap;
      margin-top: auto;
    }

    .social-btn {
      flex: 1 0 auto;
      min-width: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.6rem 0.8rem;
      border-radius: 2.5rem;
      border: none;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      color: #f0f0f0;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(4px);
    }

    .social-btn i {
      font-size: 1.1rem;
    }

    .social-btn.whatsapp {
      background: #25d366;
      color: #0a0a10;
      border-color: #25d366;
    }
    .social-btn.whatsapp:hover {
      background: #20b85a;
      transform: scale(1.04);
    }

    .social-btn.instagram {
      background: #d62976;
      color: white;
      border-color: #d62976;
    }
    .social-btn.instagram:hover {
      background: #c01e66;
      transform: scale(1.04);
    }

    .social-btn.facebook {
      background: #1877f2;
      color: white;
      border-color: #1877f2;
    }
    .social-btn.facebook:hover {
      background: #0e6bd4;
      transform: scale(1.04);
    }

    /* fallback no results */
    .no-results {
      text-align: center;
      padding: 3rem 0;
      color: #aaaac0;
      font-size: 1.2rem;
      grid-column: 1 / -1;
    }

    /* responsive fine-tune */
    @media (max-width: 700px) {
      .shop-header {
        flex-direction: column;
        align-items: flex-start;
        padding: 1rem 1.5rem;
      }
      .shop-header .logo-area {
        width: 100%;
        justify-content: space-between;
      }
      .search-wrapper {
        padding: 1rem 1.5rem;
      }
      .shop-grid-container {
        padding: 1.5rem 1rem 2rem 1rem;
      }
      .product-grid {
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 1.5rem;
      }
      .social-btn {
        font-size: 0.75rem;
        padding: 0.5rem 0.6rem;
        min-width: 44px;
      }
      .social-btn i {
        font-size: 0.95rem;
      }
    }

    @media (max-width: 480px) {
      .product-grid {
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .product-image {
        height: 160px;
      }
      .product-info h3 {
        font-size: 1rem;
      }
      .social-actions {
        gap: 0.4rem;
      }
      .social-btn {
        font-size: 0.65rem;
        padding: 0.4rem 0.4rem;
        min-width: 36px;
        gap: 0.2rem;
      }
      .social-btn i {
        font-size: 0.8rem;
      }
    }

    @media (max-width: 380px) {
      .product-grid {
        grid-template-columns: 1fr;
      }
    }

    /* small footer note */
    .shop-footer-note {
      background: #0f0f1a;
      padding: 1.2rem 2rem;
      text-align: center;
      border-top: 1px solid rgba(255, 140, 66, 0.15);
      font-size: 0.85rem;
      color: #77778f;
      margin-top: auto;
    }
    .shop-footer-note i {
      color: #ff8c42;
    }
  </style>
</head>
<body>
  <!-- header / back to main -->
  <header class="shop-header">
    <div class="logo-area">
      <h2><i class="fas fa-store" style="background: transparent; -webkit-text-fill-color: #ff8c42; margin-right: 0.3rem;"></i> Shop</h2>
      <a href="#" class="back-home" onclick="window.history.back(); return false;">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>
    <div style="display: flex; gap: 0.8rem; align-items: center;">
      <span style="color: #8888a0; font-size: 0.9rem;"><i class="fas fa-tag"></i> 12 products</span>
    </div>
  </header>

  <!-- search bar -->
  <div class="search-wrapper">
    <div class="search-bar" role="search">
      <input type="text" id="searchInput" placeholder="Search decors, perfumes, clothes ..." aria-label="Search products">
      <button id="searchBtn"><i class="fas fa-search"></i> <span class="search-label">Find</span></button>
    </div>
  </div>

  <!-- product grid -->
  <div class="shop-grid-container">
    <div style="max-width:1440px;margin:0 auto;padding:0 2rem 0 2rem;display:flex;gap:0.6rem;align-items:center;">
      <button id="addSelectedBtn" class="back-home" style="background:#ff8c42;border-color:#ff8c42;color:#0a0a10;">Add selected to cart</button>
      <button id="clearSelectionBtn" class="back-home" style="background:transparent;color:#ff8c42;border-color:rgba(255,255,255,0.06);">Clear selection</button>
      <a href="cart.html" class="back-home" style="margin-left:auto;">View Cart</a>
    </div>
    <div class="product-grid" id="productGrid">
      <!-- products injected by JS -->
    </div>
  </div>

  <!-- tiny footer -->
  <div class="shop-footer-note">
    <i class="fas fa-heart"></i>  connect with us · tap any social button to share
  </div>

  <script>
    (function() {
      // ----- product data -----
      const products = [
        // decors
        { id: 1, name: "Rustic Wall Clock", category: "Decor", price: "45.00", image: "https://images.unsplash.com/photo-1563861826100-9cb868fdbe1c?q=80&w=2070&auto=format&fit=crop", badge: "new" },
        { id: 2, name: "Ceramic Vase Set", category: "Decor", price: "32.50", image: "https://images.unsplash.com/photo-1586023492125-27b2c045efd7?q=80&w=2058&auto=format&fit=crop", badge: "sale" },
        { id: 3, name: "Macrame Wall Hanging", category: "Decor", price: "28.00", image: "https://images.unsplash.com/photo-1618354691373-d851c5c3a990?q=80&w=2015&auto=format&fit=crop", badge: null },
        // perfumes
        { id: 4, name: "Santal & Wood", category: "Perfume", price: "68.00", image: "https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=2069&auto=format&fit=crop", badge: "popular" },
        { id: 5, name: "Citrus Bloom", category: "Perfume", price: "55.00", image: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?q=80&w=2036&auto=format&fit=crop", badge: null },
        { id: 6, name: "Oud Noir", category: "Perfume", price: "89.00", image: "https://images.unsplash.com/photo-1585386959984-a4155224a1ad?q=80&w=2070&auto=format&fit=crop", badge: "luxury" },
        // nguo (clothes)
        { id: 7, name: "Linen Blend Shirt", category: "Clothing", price: "42.00", image: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?q=80&w=2076&auto=format&fit=crop", badge: null },
        { id: 8, name: "Oversized Denim Jacket", category: "Clothing", price: "79.00", image: "https://images.unsplash.com/photo-1576995853123-5a10305d93c0?q=80&w=2070&auto=format&fit=crop", badge: "trending" },
        { id: 9, name: "Cashmere Scarf", category: "Clothing", price: "38.50", image: "https://images.unsplash.com/photo-1601924994987-69e26d50dc26?q=80&w=2070&auto=format&fit=crop", badge: null },
        // more decors
        { id: 10, name: "Geometric Candle Holder", category: "Decor", price: "22.00", image: "https://images.unsplash.com/photo-1608042314453-ae338d80c427?q=80&w=2070&auto=format&fit=crop", badge: null },
        { id: 11, name: "Velvet Throw Pillow", category: "Decor", price: "34.00", image: "https://images.unsplash.com/photo-1584100936595-c0654b55a2e6?q=80&w=2011&auto=format&fit=crop", badge: "sale" },
        // extra perfume
        { id: 12, name: "Mystic Amber", category: "Perfume", price: "74.00", image: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?q=80&w=2036&auto=format&fit=crop", badge: "new" }
      ];

      // ----- helper: share URLs (simulate) -----
      function getProductUrl(product) {
        // In real scenario: dynamic link. We'll use a dummy.
        return `https://newclass.com/product/${product.id}-${product.name.replace(/\s+/g, '-').toLowerCase()}`;
      }

      // render products (filter optional)
      function renderProducts(filter = '') {
        const grid = document.getElementById('productGrid');
        if (!grid) return;

        const query = filter.trim().toLowerCase();
        const filtered = products.filter(p => {
          if (!query) return true;
          return p.name.toLowerCase().includes(query) || 
                 p.category.toLowerCase().includes(query);
        });

        if (filtered.length === 0) {
          grid.innerHTML = `<div class="no-results"><i class="fas fa-search" style="font-size:2rem; opacity:0.5; display:block; margin-bottom:1rem;"></i> No products found for “${filter}”</div>`;
          return;
        }

        let html = '';
        filtered.forEach(p => {
          // build social share links (whatsapp, instagram, facebook)
          const productUrl = getProductUrl(p);
          const shareText = `Check out ${p.name} at New Class!`;
          const waLink = `https://wa.me/?text=${encodeURIComponent(shareText + ' ' + productUrl)}`;
          const fbLink = `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(productUrl)}`;
          const igLink = `https://www.instagram.com/`; // dummy, because Instagram doesn't have direct share URL; we use a fallback (copy or open)

          // badge
          const badgeHtml = p.badge ? `<span class="badge">${p.badge}</span>` : '';

          html += `
            <div class="product-card" data-id="${p.id}">
              <div class="product-image" style="background-image: url('${p.image}');">
                <script>
                  (function() {
                    const products = [
                      { id: 1, name: 'Santal & Wood Perfume', category: 'Perfume', price: 68.00, image: 'https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=2069&auto=format&fit=crop' },
                      { id: 2, name: 'Rustic Wall Clock', category: 'Decor', price: 45.00, image: 'https://images.unsplash.com/photo-1563861826100-9cb868fdbe1c?q=80&w=2070&auto=format&fit=crop' },
                      { id: 3, name: 'Oversized Denim Jacket', category: 'Clothing', price: 79.00, image: 'https://images.unsplash.com/photo-1576995853123-5a10305d93c0?q=80&w=2070&auto=format&fit=crop' },
                      { id: 4, name: 'Handmade Ceramic Mug', category: 'Home', price: 22.00, image: 'https://images.unsplash.com/photo-1508747703725-7191a1f5b9c9?q=80&w=2070&auto=format&fit=crop' }
                    ];

                    const productGrid = document.getElementById('productGrid');
                    const addSelectedBtn = document.getElementById('addSelectedBtn');
                    const clearSelectionBtn = document.getElementById('clearSelectionBtn');

                    function loadCart() {
                      try { return JSON.parse(localStorage.getItem('nc_cart') || '[]'); }
                      catch (e) { return []; }
                    }

                    function saveCart(cart) { localStorage.setItem('nc_cart', JSON.stringify(cart)); }

                    function addToCart(productId, qty) {
                      qty = Math.max(1, parseInt(qty) || 1);
                      const product = products.find(p => p.id === productId);
                      if (!product) return;
                      const cart = loadCart();
                      const existing = cart.find(i => i.id === productId);
                      if (existing) existing.quantity += qty;
                      else cart.push(Object.assign({}, product, { quantity: qty }));
                      saveCart(cart);
                      showToast(`${product.name} (x${qty}) added to cart`);
                    }

                    window.addToCartHandler = function(id, qty) { addToCart(id, qty); };

                    function addSelectedToCart() {
                      let any = false;
                      products.forEach(p => {
                        const sel = document.getElementById('select-' + p.id);
                        if (sel && sel.checked) {
                          const qEl = document.getElementById('qty-' + p.id);
                          const qty = qEl ? parseInt(qEl.value) || 1 : 1;
                          addToCart(p.id, qty);
                          any = true;
                        }
                      });
                      if (!any) showToast('No products selected');
                      else showToast('Selected products added to cart');
                    }

                    function clearSelection() {
                      products.forEach(p => {
                        const sel = document.getElementById('select-' + p.id);
                        const qEl = document.getElementById('qty-' + p.id);
                        if (sel) sel.checked = false;
                        if (qEl) qEl.value = '1';
                      });
                    }

                    addSelectedBtn.addEventListener('click', addSelectedToCart);
                    clearSelectionBtn.addEventListener('click', clearSelection);

                    function renderProducts(items) {
                      productGrid.innerHTML = items.map(p => `
                        <div class="product-card">
                          <div class="product-image" style="background-image: url('${p.image}')">
                            <div class="badge">${p.category}</div>
                          </div>
                          <div class="product-info">
                            <h3>${p.name}</h3>
                            <div class="category">${p.category}</div>
                            <div class="price">$${p.price.toFixed(2)}</div>
                            <div style="display:flex;gap:0.6rem;align-items:center;margin-top:0.6rem;">
                              <label style="display:flex;align-items:center;gap:0.4rem;color:#ccc;font-weight:600;"><input id="select-${p.id}" type="checkbox" /> Select</label>
                              <input id="qty-${p.id}" type="number" min="1" value="1" style="width:72px;padding:0.4rem;border-radius:0.6rem;background:transparent;border:1px solid rgba(255,255,255,0.06);color:#fff;font-weight:700" />
                            </div>
                            <div class="social-actions">
                              <button class="social-btn" onclick="addToCartHandler(${p.id}, parseInt(document.getElementById('qty-${p.id}').value) || 1)">Add to cart</button>
                            </div>
                          </div>
                        </div>
                      `).join('');
                    }

                    // simple toast
                    function showToast(msg) {
                      const t = document.createElement('div');
                      t.textContent = msg;
                      t.style.cssText = 'position:fixed;bottom:1.6rem;left:50%;transform:translateX(-50%);background:#1e1e30;color:#fff;padding:0.7rem 1.2rem;border-radius:1.2rem;border:1px solid rgba(255,140,66,0.2);z-index:9999';
                      document.body.appendChild(t);
                      setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity 0.3s'; setTimeout(()=>t.remove(),300); }, 2200);
                    }

                    renderProducts(products);
                  })();
                </script>
    })();
  </script>
</body>
</html>
