<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shop · New Class</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0f0f17;font-family:'Segoe UI',Roboto,system-ui,sans-serif;color:#f0f0f0;min-height:100vh;display:flex;flex-direction:column}
    .shop-header{background:#12121f;padding:1.2rem 2rem;border-bottom:3px solid #ff8c42;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:1rem}
    .shop-header .logo-area{display:flex;align-items:center;gap:1rem}
    .shop-header .logo-area h2{font-size:1.8rem;font-weight:700;background:linear-gradient(to right,#ff8c42,#ffb347);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .back-home{background:rgba(255,140,66,0.15);border:1px solid #ff8c42;color:#ff8c42;padding:.5rem 1.2rem;border-radius:2rem;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:.6rem}
    .back-home:hover{background:#ff8c42;color:#0a0a10;transform:translateY(-2px)}

    .filter-toolbar{background:#1a1a28;padding:1rem 2rem;border-bottom:1px solid rgba(255,140,66,0.15);display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
    .filter-btn{background:rgba(255,255,255,0.04);border:1px solid rgba(255,140,66,0.2);color:#b0b0c8;padding:.4rem 1rem;border-radius:2rem;font-weight:600;cursor:pointer}
    .filter-btn.active{background:#ff8c42;color:#0a0a10;border-color:#ff8c42}

    .shop-grid-container{padding:2rem 2rem 3rem 2rem;flex:1;max-width:1440px;margin:0 auto;width:100%}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2rem}

    .product-card{background:#1e1e30;border-radius:2rem;overflow:hidden;border:1px solid rgba(255,140,66,0.15);display:flex;flex-direction:column;box-shadow:0 12px 30px rgba(0,0,0,0.5);position:relative}
    .product-card:hover{transform:translateY(-8px);box-shadow:0 20px 40px rgba(255,140,66,0.25);border-color:rgba(255,140,66,0.4)}

    .product-badge{position:absolute;top:1rem;left:1rem;background:#ff8c42;color:#0a0a10;padding:.3rem 1rem;border-radius:2rem;font-weight:700;font-size:.8rem}
    .rank-number{position:absolute;top:1rem;right:1rem;background:rgba(0,0,0,0.6);color:#ff8c42;padding:.3rem .9rem;border-radius:2rem}

    .product-image{height:220px;background-size:cover;background-position:center;background-color:#2a2a3e}
    .product-image .overlay{position:absolute;bottom:0;left:0;right:0;padding:1rem;display:flex;justify-content:space-between;align-items:center}

    .product-info{padding:1.2rem;flex:1;display:flex;flex-direction:column}
    .product-name{font-size:1.15rem;font-weight:700;color:#f0e6ff}
    .product-category{color:#8888a0;font-size:.9rem;margin-top:.25rem}
    .product-price{color:#ff8c42;font-weight:700;font-size:1.2rem;margin-top:.6rem}

    .social-actions{display:flex;gap:.6rem;margin-top:auto}
    .social-btn{flex:1;min-width:48px;padding:.6rem;border-radius:2.5rem;border:none;font-weight:700;cursor:pointer;background:rgba(255,255,255,0.06);color:#f0f0f0}
    .social-btn.buy{background:#ff8c42;color:#0a0a10}

    .shop-footer-note{background:#0f0f1a;padding:1rem 2rem;text-align:center;border-top:1px solid rgba(255,140,66,0.12);color:#777}

    @media(max-width:768px){.product-image{height:180px}.product-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}}
  </style>
</head>
<body>
  <header class="shop-header">
    <h2><i class="fas fa-store" style="color:#ff8c42;margin-right:.4rem"></i> Shop</h2>
    <a href="../index.html" class="back-home">Back to home</a>
  </header>

  <div class="search-wrapper">
    <div class="search-bar">
      <input id="searchInput" placeholder="Search products..." aria-label="Search products">
      <button id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
  </div>

  <div class="filter-toolbar">
    <div style="display:flex;gap:0.6rem;align-items:center">
      <button class="filter-btn active">All</button>
      <button class="filter-btn">Decor</button>
      <button class="filter-btn">Perfume</button>
      <button class="filter-btn">Clothing</button>
    </div>
    <div style="margin-left:auto;display:flex;gap:0.6rem;align-items:center">
      <a href="select.html" class="back-home">Select multiple</a>
      <a href="cart.html" class="back-home">View cart</a>
    </div>
  </div>

  <main class="shop-grid-container">
    <div class="product-grid" id="productGrid"></div>
  </main>

  <div class="shop-footer-note">Browse products and click "Add to cart" to add a single item. Use "Select multiple" to pick several products at once.</div>

  <script>
    (function(){
      const products = [
        { id: 1, name: 'Rustic Wall Clock', category: 'Decor', price: 45.00, image: 'https://images.unsplash.com/photo-1563861826100-9cb868fdbe1c?q=80&w=2070&auto=format&fit=crop', badge: 'new' },
        { id: 2, name: 'Ceramic Vase Set', category: 'Decor', price: 32.50, image: 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?q=80&w=2058&auto=format&fit=crop', badge: 'sale' },
        { id: 3, name: 'Macrame Wall Hanging', category: 'Decor', price: 28.00, image: 'https://images.unsplash.com/photo-1618354691373-d851c5c3a990?q=80&w=2015&auto=format&fit=crop' },
        { id: 4, name: 'Santal & Wood', category: 'Perfume', price: 68.00, image: 'https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=2069&auto=format&fit=crop', badge: 'popular' },
        { id: 5, name: 'Citrus Bloom', category: 'Perfume', price: 55.00, image: 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?q=80&w=2036&auto=format&fit=crop' },
        { id: 6, name: 'Oud Noir', category: 'Perfume', price: 89.00, image: 'https://images.unsplash.com/photo-1585386959984-a4155224a1ad?q=80&w=2070&auto=format&fit=crop', badge: 'luxury' },
        { id: 7, name: 'Linen Blend Shirt', category: 'Clothing', price: 42.00, image: 'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?q=80&w=2076&auto=format&fit=crop' },
        { id: 8, name: 'Oversized Denim Jacket', category: 'Clothing', price: 79.00, image: 'https://images.unsplash.com/photo-1576995853123-5a10305d93c0?q=80&w=2070&auto=format&fit=crop', badge: 'trending' },
        { id: 9, name: 'Cashmere Scarf', category: 'Clothing', price: 38.50, image: 'https://images.unsplash.com/photo-1601924994987-69e26d50dc26?q=80&w=2070&auto=format&fit=crop' },
        { id: 10, name: 'Geometric Candle Holder', category: 'Decor', price: 22.00, image: 'https://images.unsplash.com/photo-1608042314453-ae338d80c427?q=80&w=2070&auto=format&fit=crop' },
        { id: 11, name: 'Velvet Throw Pillow', category: 'Decor', price: 34.00, image: 'https://images.unsplash.com/photo-1584100936595-c0654b55a2e6?q=80&w=2011&auto=format&fit=crop', badge: 'sale' },
        { id: 12, name: 'Mystic Amber', category: 'Perfume', price: 74.00, image: 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?q=80&w=2036&auto=format&fit=crop', badge: 'new' }
      ];

      const grid = document.getElementById('productGrid');

      function loadCart(){ try{return JSON.parse(localStorage.getItem('nc_cart')||'[]')}catch(e){return[]}}
      function saveCart(c){ localStorage.setItem('nc_cart', JSON.stringify(c)); }

      function addToCart(id){
        const p = products.find(x=>x.id===id);
        if(!p) return;
        const cart = loadCart();
        const ex = cart.find(i=>i.id===id);
        if(ex) ex.quantity += 1; else cart.push(Object.assign({}, p, { quantity: 1 }));
        saveCart(cart);
        showToast(`${p.name} added to cart`);
      }

      window.addToCartHandler = addToCart;

      function render(list){
        if(!grid) return;
        grid.innerHTML = list.map((p, idx)=>`
          <div class="product-card" data-id="${p.id}">
            ${p.badge?`<div class="product-badge">${p.badge}</div>`:''}
            <div class="product-image" style="background-image:url('${p.image}')"></div>
            <div class="product-info">
              <div class="product-name">${p.name}</div>
              <div class="product-category">${p.category}</div>
              <div class="product-price">$${p.price.toFixed(2)}</div>
              <div class="social-actions">
                <button class="social-btn" onclick="window.open('${getShareLink(p)}','_blank')"><i class="fas fa-share-alt"></i> Share</button>
                <button class="social-btn buy" onclick="addToCartHandler(${p.id})"><i class="fas fa-cart-plus"></i> Add to cart</button>
              </div>
            </div>
          </div>
        `).join('');
      }

      function getShareLink(p){ const url = `https://newclass.com/product/${p.id}`; return `https://wa.me/?text=${encodeURIComponent(p.name+' '+url)}`; }

      // filter buttons
      document.querySelectorAll('.filter-btn').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
          btn.classList.add('active');
          const cat = btn.textContent.trim();
          if(cat==='All') render(products); else render(products.filter(x=>x.category.toLowerCase()===cat.toLowerCase()));
        });
      });

      document.getElementById('searchBtn').addEventListener('click', ()=>{
        const q = document.getElementById('searchInput').value.trim().toLowerCase();
        if(!q) render(products); else render(products.filter(p=>p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)));
      });

      render(products);

      function showToast(msg){ const t=document.createElement('div'); t.textContent=msg; t.style.cssText='position:fixed;bottom:1.6rem;left:50%;transform:translateX(-50%);background:#1e1e30;color:#fff;padding:.7rem 1.2rem;border-radius:1.2rem;border:1px solid rgba(255,140,66,0.2);z-index:9999'; document.body.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300)},1800); }
    })();
  </script>
</body>
</html>
