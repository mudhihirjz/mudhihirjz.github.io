<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Shop · New Class</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* (kept same styling as before for brevity) */
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#0f0f17;font-family:'Segoe UI',Roboto,system-ui,sans-serif;color:#f0f0f0;min-height:100vh;display:flex;flex-direction:column}
    .shop-header{background:#12121f;padding:1.2rem 2rem;border-bottom:3px solid #ff8c42;display:flex;align-items:center;justify-content:space-between}
    .shop-header h2{font-size:1.6rem;background:linear-gradient(90deg,#ff8c42,#ffb347);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
    .back-home{background:rgba(255,140,66,0.12);border:1px solid rgba(255,140,66,0.25);color:#e0dce8;padding:.5rem 1rem;border-radius:1.6rem;text-decoration:none}
    .search-wrapper{padding:1.2rem 2rem;background:#1a1a28;border-bottom:1px solid rgba(255,140,66,0.08)}
    .search-bar{max-width:700px;margin:0 auto;display:flex;background:#252536;border-radius:3rem;border:1px solid rgba(255,140,66,0.2);overflow:hidden}
    .search-bar input{flex:1;padding:.9rem 1.2rem;background:transparent;border:none;color:#f0f0f0}
    .search-bar button{background:#ff8c42;border:none;padding:0 1.2rem;color:#0a0a10;font-weight:700}
    .shop-grid-container{padding:2rem;max-width:1200px;margin:0 auto;width:100%}
    .product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1.6rem}
    .product-card{background:#1e1e30;border-radius:1rem;overflow:hidden;border:1px solid rgba(255,140,66,0.08);display:flex;flex-direction:column}
    .product-image{height:200px;background-size:cover;background-position:center}
    .product-info{padding:1rem;display:flex;flex-direction:column;gap:.6rem}
    .price{color:#ff8c42;font-weight:700}
    .social-actions{margin-top:auto;display:flex;gap:.5rem}
    .social-btn{flex:1;padding:.6rem;border-radius:.6rem;border:none;background:rgba(255,255,255,0.04);color:#fff}
    .shop-footer-note{padding:1rem 2rem;text-align:center;color:#777}
  </style>
</head>
<body>
  <header class="shop-header">
    <h2><i class="fas fa-store" style="color:#ff8c42;margin-right:.4rem"></i> Shop</h2>
    <a href="../index.html" class="back-home">Back to home</a>
  </header>

  <div class="search-wrapper">
    <div class="search-bar">
      <input id="searchInput" placeholder="Search products..." aria-label="Search products">
      <button id="searchBtn"><i class="fas fa-search"></i></button>
    </div>
  </div>

  <main class="shop-grid-container">
    <div class="product-grid" id="productGrid"></div>
  </main>

  <div class="shop-footer-note">Browse products and click "Add to cart" to add a single item.</div>

  <script>
    (function(){
      const products = [
        { id: 1, name: 'Rustic Wall Clock', category: 'Decor', price: 45.00, image: 'https://images.unsplash.com/photo-1563861826100-9cb868fdbe1c?q=80&w=2070&auto=format&fit=crop' },
        { id: 2, name: 'Ceramic Vase Set', category: 'Decor', price: 32.50, image: 'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?q=80&w=2058&auto=format&fit=crop' },
        { id: 3, name: 'Macrame Wall Hanging', category: 'Decor', price: 28.00, image: 'https://images.unsplash.com/photo-1618354691373-d851c5c3a990?q=80&w=2015&auto=format&fit=crop' },
        { id: 4, name: 'Santal & Wood', category: 'Perfume', price: 68.00, image: 'https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=2069&auto=format&fit=crop' },
        { id: 5, name: 'Citrus Bloom', category: 'Perfume', price: 55.00, image: 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?q=80&w=2036&auto=format&fit=crop' },
        { id: 6, name: 'Oud Noir', category: 'Perfume', price: 89.00, image: 'https://images.unsplash.com/photo-1585386959984-a4155224a1ad?q=80&w=2070&auto=format&fit=crop' },
        { id: 7, name: 'Linen Blend Shirt', category: 'Clothing', price: 42.00, image: 'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?q=80&w=2076&auto=format&fit=crop' },
        { id: 8, name: 'Oversized Denim Jacket', category: 'Clothing', price: 79.00, image: 'https://images.unsplash.com/photo-1576995853123-5a10305d93c0?q=80&w=2070&auto=format&fit=crop' },
        { id: 9, name: 'Cashmere Scarf', category: 'Clothing', price: 38.50, image: 'https://images.unsplash.com/photo-1601924994987-69e26d50dc26?q=80&w=2070&auto=format&fit=crop' },
        { id: 10, name: 'Geometric Candle Holder', category: 'Decor', price: 22.00, image: 'https://images.unsplash.com/photo-1608042314453-ae338d80c427?q=80&w=2070&auto=format&fit=crop' },
        { id: 11, name: 'Velvet Throw Pillow', category: 'Decor', price: 34.00, image: 'https://images.unsplash.com/photo-1584100936595-c0654b55a2e6?q=80&w=2011&auto=format&fit=crop' },
        { id: 12, name: 'Mystic Amber', category: 'Perfume', price: 74.00, image: 'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?q=80&w=2036&auto=format&fit=crop' }
      ];

      const grid = document.getElementById('productGrid');

      function loadCart(){ try{return JSON.parse(localStorage.getItem('nc_cart')||'[]')}catch(e){return[]}}
      function saveCart(c){ localStorage.setItem('nc_cart', JSON.stringify(c)); }

      function addToCart(id){
        const p = products.find(x=>x.id===id);
        if(!p) return;
        const cart = loadCart();
        const ex = cart.find(i=>i.id===id);
        if(ex) ex.quantity += 1; else cart.push(Object.assign({}, p, { quantity: 1 }));
        saveCart(cart);
        showToast(`${p.name} added to cart`);
      }

      window.addToCartHandler = addToCart;

      function render(list){
        grid.innerHTML = list.map(p=>`
          <div class="product-card">
            <div class="product-image" style="background-image:url('${p.image}')"></div>
            <div class="product-info">
              <div style="font-weight:700">${p.name}</div>
              <div style="color:#aaa">${p.category}</div>
              <div class="price">$${p.price.toFixed(2)}</div>
              <div class="social-actions">
                <button class="social-btn" onclick="addToCartHandler(${p.id})">Add to cart</button>
              </div>
            </div>
          </div>
        `).join('');
      }

      document.getElementById('searchBtn').addEventListener('click', ()=>{
        const q = document.getElementById('searchInput').value.trim().toLowerCase();
        if(!q) render(products); else render(products.filter(p=>p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q)));
      });

      render(products);

      function showToast(msg){ const t=document.createElement('div'); t.textContent=msg; t.style.cssText='position:fixed;bottom:1.6rem;left:50%;transform:translateX(-50%);background:#1e1e30;color:#fff;padding:.7rem 1.2rem;border-radius:1.2rem;border:1px solid rgba(255,140,66,0.2);z-index:9999'; document.body.appendChild(t); setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),300)},1800); }
    })();
  </script>
</body>
</html>
