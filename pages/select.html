<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Select Items · New Class</title>
  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0f0f17;
      font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* header – same as popular */
    .select-header {
      background: #12121f;
      padding: 1.2rem 2rem;
      border-bottom: 3px solid #ff8c42;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .select-header .logo-area {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .select-header .logo-area h2 {
      font-size: 1.8rem;
      font-weight: 700;
      background: linear-gradient(to right, #ff8c42, #ffb347);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .back-home {
      background: rgba(255, 140, 66, 0.15);
      border: 1px solid #ff8c42;
      color: #ff8c42;
      padding: 0.5rem 1.2rem;
      border-radius: 2rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      transition: 0.25s ease;
      font-size: 0.95rem;
    }

    .back-home:hover {
      background: #ff8c42;
      color: #0a0a10;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 140, 66, 0.4);
    }

    .stats-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(255, 140, 66, 0.12);
      padding: 0.4rem 1.2rem;
      border-radius: 2rem;
      border: 1px solid rgba(255, 140, 66, 0.2);
      font-size: 0.9rem;
      color: #ff8c42;
    }

    .stats-badge i {
      font-size: 1rem;
    }

    /* toolbar – same as popular */
    .select-toolbar {
      background: #1a1a28;
      padding: 1rem 2rem;
      border-bottom: 1px solid rgba(255, 140, 66, 0.2);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .action-buttons {
      display: flex;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .action-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 140, 66, 0.2);
      color: #b0b0c8;
      padding: 0.4rem 1.2rem;
      border-radius: 2rem;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .action-btn:hover {
      background: #ff8c42;
      color: #0a0a10;
    }

    .action-btn.primary {
      background: #ff8c42;
      color: #0a0a10;
      border-color: #ff8c42;
    }

    .action-btn.primary:hover {
      background: #ffaa5e;
    }

    .action-btn i {
      font-size: 0.9rem;
    }

    .nav-links {
      display: flex;
      gap: 0.6rem;
      align-items: center;
    }

    .nav-links .back-home {
      font-size: 0.85rem;
      padding: 0.4rem 1rem;
    }

    /* selection info */
    .selection-info {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      color: #8888a0;
      font-size: 0.85rem;
    }

    .selection-info .count {
      color: #ff8c42;
      font-weight: 700;
    }

    /* grid – same as popular */
    .select-grid-container {
      padding: 2rem 2rem 3rem 2rem;
      flex: 1;
      max-width: 1440px;
      margin: 0 auto;
      width: 100%;
    }

    .select-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 2rem;
    }

    /* product card – same as popular */
    .product-card {
      background: #1e1e30;
      border-radius: 2rem;
      overflow: hidden;
      border: 1px solid rgba(255, 140, 66, 0.15);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      display: flex;
      flex-direction: column;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      position: relative;
    }

    .product-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 40px rgba(255, 140, 66, 0.25);
      border-color: rgba(255, 140, 66, 0.4);
    }

    .product-card .product-badge {
      position: absolute;
      top: 1rem;
      left: 1rem;
      background: #ff8c42;
      color: #0a0a10;
      padding: 0.3rem 1.2rem;
      border-radius: 2rem;
      font-weight: 700;
      font-size: 0.8rem;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 4px 15px rgba(255, 140, 66, 0.4);
    }

    /* checkbox juu kulia – badala ya rank number */
    .product-card .select-checkbox-wrapper {
      position: absolute;
      top: 1rem;
      right: 1rem;
      z-index: 3;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      padding: 0.4rem 0.6rem;
      border-radius: 2rem;
      border: 1px solid rgba(255, 140, 66, 0.3);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .product-card .select-checkbox-wrapper label {
      color: #b0b0c8;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .product-card .select-checkbox-wrapper input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #ff8c42;
      cursor: pointer;
    }

    .product-image {
      height: 240px;
      background-size: cover;
      background-position: center;
      background-color: #2a2a3e;
      position: relative;
    }

    .product-image .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
      padding: 1rem 1.2rem 0.8rem 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .product-image .overlay .price-tag {
      background: rgba(255, 140, 66, 0.85);
      padding: 0.2rem 1rem;
      border-radius: 2rem;
      font-size: 0.9rem;
      font-weight: 700;
      color: #0a0a10;
    }

    .product-image .overlay .category-tag {
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      padding: 0.2rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      color: #b0b0c8;
    }

    .product-info {
      padding: 1.2rem 1.2rem 1rem 1.2rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .product-info .product-name {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.2rem;
      color: #f0e6ff;
    }

    .product-info .product-category {
      font-size: 0.8rem;
      color: #8888a0;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin-bottom: 0.3rem;
    }

    .product-info .product-price {
      font-size: 1.3rem;
      font-weight: 700;
      color: #ff8c42;
      margin: 0.3rem 0 0.8rem 0;
    }

    .product-info .product-price .original-price {
      font-size: 0.9rem;
      color: #77778f;
      text-decoration: line-through;
      margin-left: 0.5rem;
      font-weight: 400;
    }

    /* quantity control chini ya price */
    .qty-control {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.2rem;
      padding: 0.4rem 0.6rem;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      width: fit-content;
    }

    .qty-control label {
      font-size: 0.8rem;
      color: #77778f;
      font-weight: 600;
    }

    .qty-control input[type="number"] {
      width: 56px;
      padding: 0.3rem 0.4rem;
      border-radius: 0.6rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f0f0f0;
      font-size: 0.85rem;
      text-align: center;
      outline: none;
      transition: 0.2s;
    }

    .qty-control input[type="number"]:focus {
      border-color: #ff8c42;
      box-shadow: 0 0 0 3px rgba(255, 140, 66, 0.15);
    }

    .qty-control input[type="number"]::-webkit-inner-spin-button {
      opacity: 0.5;
    }

    .product-card.selected {
      border-color: #ff8c42;
      box-shadow: 0 0 0 2px rgba(255, 140, 66, 0.3), 0 12px 30px rgba(0, 0, 0, 0.5);
    }

    .no-results {
      text-align: center;
      padding: 3rem 0;
      color: #aaaac0;
      font-size: 1.2rem;
      grid-column: 1 / -1;
    }

    /* responsive */
    @media (max-width: 768px) {
      .select-header {
        flex-direction: column;
        align-items: flex-start;
        padding: 1rem 1.5rem;
      }
      .select-toolbar {
        flex-direction: column;
        align-items: stretch;
        padding: 1rem 1.5rem;
      }
      .nav-links {
        justify-content: center;
      }
      .select-grid-container {
        padding: 1.5rem 1rem 2rem 1rem;
      }
      .select-grid {
        grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
        gap: 1.5rem;
      }
      .product-image {
        height: 190px;
      }
      .product-card .select-checkbox-wrapper {
        top: 0.6rem;
        right: 0.6rem;
        padding: 0.3rem 0.5rem;
      }
      .product-card .select-checkbox-wrapper input[type="checkbox"] {
        width: 16px;
        height: 16px;
      }
      .product-card .select-checkbox-wrapper label {
        font-size: 0.6rem;
      }
    }

    @media (max-width: 500px) {
      .select-grid {
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }
      .product-image {
        height: 150px;
      }
      .product-info .product-name {
        font-size: 1rem;
      }
      .product-info .product-price {
        font-size: 1.1rem;
      }
      .product-card .product-badge {
        font-size: 0.65rem;
        padding: 0.2rem 0.8rem;
      }
      .product-card .select-checkbox-wrapper {
        top: 0.5rem;
        right: 0.5rem;
        padding: 0.2rem 0.4rem;
      }
      .product-card .select-checkbox-wrapper input[type="checkbox"] {
        width: 14px;
        height: 14px;
      }
      .product-card .select-checkbox-wrapper label {
        font-size: 0.5rem;
      }
      .action-btn {
        font-size: 0.7rem;
        padding: 0.2rem 0.8rem;
      }
      .qty-control {
        width: 100%;
        justify-content: space-between;
      }
      .qty-control input[type="number"] {
        width: 48px;
        font-size: 0.75rem;
      }
    }

    @media (max-width: 380px) {
      .select-grid {
        grid-template-columns: 1fr;
      }
    }

    .footer-note {
      background: #0f0f1a;
      padding: 1rem 2rem;
      text-align: center;
      border-top: 1px solid rgba(255, 140, 66, 0.15);
      font-size: 0.85rem;
      color: #77778f;
      margin-top: auto;
    }
    .footer-note i {
      color: #ff8c42;
    }
  </style>
</head>
<body>
  <!-- header – same as popular -->
  <header class="select-header">
    <div class="logo-area">
      <h2><i class="fas fa-list" style="background:transparent; -webkit-text-fill-color:#ff8c42; margin-right:0.3rem;"></i> Select</h2>
      <a href="#" class="back-home" onclick="window.history.back(); return false;">
        <i class="fas fa-arrow-left"></i> Back
      </a>
    </div>
    <div class="stats-badge">
      <i class="fas fa-shopping-cart"></i> <span id="cartCount">0</span> items in cart
    </div>
  </header>

  <!-- toolbar – same as popular -->
  <div class="select-toolbar">
    <div class="action-buttons">
      <button id="addSelectedBtn" class="action-btn primary">
        <i class="fas fa-cart-plus"></i> Add Selected
      </button>
      <button id="selectAllBtn" class="action-btn">
        <i class="fas fa-check-double"></i> Select All
      </button>
      <button id="clearSelectionBtn" class="action-btn">
        <i class="fas fa-times"></i> Clear
      </button>
    </div>
    <div class="nav-links">
      <span class="selection-info">
        <i class="fas fa-check-circle"></i> <span class="count" id="selectedCount">0</span> selected
      </span>
      <a href="shop.html" class="back-home"><i class="fas fa-store"></i> Shop</a>
      <a href="cart.html" class="back-home"><i class="fas fa-shopping-bag"></i> Cart</a>
    </div>
  </div>

  <!-- grid -->
  <div class="select-grid-container">
    <div class="select-grid" id="selectGrid"></div>
  </div>

  <div class="footer-note">
    <i class="fas fa-check-circle"></i>  select multiple items · add to cart at once
  </div>

  <script>
    (function() {
      // ----- product data -----
      const products = [
        { id: 1, name: "Rustic Wall Clock", category: "decor", price: 45, originalPrice: 65, image: "https://images.unsplash.com/photo-1563861826100-9cb868fdbe1c?q=80&w=2070&auto=format&fit=crop", badge: "⭐ Top Rated" },
        { id: 2, name: "Ceramic Vase Set", category: "decor", price: 32.50, originalPrice: 48, image: "https://images.unsplash.com/photo-1586023492125-27b2c045efd7?q=80&w=2058&auto=format&fit=crop", badge: "⭐ Popular" },
        { id: 3, name: "Macrame Wall Hanging", category: "decor", price: 28, originalPrice: 40, image: "https://images.unsplash.com/photo-1618354691373-d851c5c3a990?q=80&w=2015&auto=format&fit=crop", badge: "🌿 Boho" },
        { id: 4, name: "Santal & Wood", category: "perfume", price: 68, originalPrice: 89, image: "https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=2069&auto=format&fit=crop", badge: "🔥 Bestseller" },
        { id: 5, name: "Citrus Bloom", category: "perfume", price: 55, originalPrice: 75, image: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?q=80&w=2036&auto=format&fit=crop", badge: "🌸 Fresh" },
        { id: 6, name: "Oud Noir", category: "perfume", price: 89, originalPrice: 120, image: "https://images.unsplash.com/photo-1585386959984-a4155224a1ad?q=80&w=2070&auto=format&fit=crop", badge: "💎 Luxury" },
        { id: 7, name: "Linen Blend Shirt", category: "clothing", price: 42, originalPrice: 60, image: "https://images.unsplash.com/photo-1596755094514-f87e34085b2c?q=80&w=2076&auto=format&fit=crop", badge: "👕 Classic" },
        { id: 8, name: "Oversized Denim Jacket", category: "clothing", price: 79, originalPrice: 110, image: "https://images.unsplash.com/photo-1576995853123-5a10305d93c0?q=80&w=2070&auto=format&fit=crop", badge: "🔥 Trending" },
        { id: 9, name: "Cashmere Scarf", category: "clothing", price: 38.50, originalPrice: 55, image: "https://images.unsplash.com/photo-1601924994987-69e26d50dc26?q=80&w=2070&auto=format&fit=crop", badge: "🧣 Winter" },
        { id: 10, name: "Geometric Candle Holder", category: "decor", price: 22, originalPrice: 32, image: "https://images.unsplash.com/photo-1608042314453-ae338d80c427?q=80&w=2070&auto=format&fit=crop", badge: "🕯️ Modern" },
        { id: 11, name: "Velvet Throw Pillow", category: "decor", price: 34, originalPrice: 46, image: "https://images.unsplash.com/photo-1584100936595-c0654b55a2e6?q=80&w=2011&auto=format&fit=crop", badge: "🛋️ Cozy" },
        { id: 12, name: "Mystic Amber", category: "perfume", price: 74, originalPrice: 95, image: "https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?q=80&w=2036&auto=format&fit=crop", badge: "✨ New" }
      ];

      const grid = document.getElementById('selectGrid');
      const cartCountEl = document.getElementById('cartCount');
      const selectedCountEl = document.getElementById('selectedCount');
      const addBtn = document.getElementById('addSelectedBtn');
      const selectAllBtn = document.getElementById('selectAllBtn');
      const clearBtn = document.getElementById('clearSelectionBtn');

      // ----- cart functions -----
      function loadCart() {
        try { return JSON.parse(localStorage.getItem('nc_cart') || '[]'); } catch (e) { return []; }
      }

      function saveCart(cart) {
        localStorage.setItem('nc_cart', JSON.stringify(cart));
        updateCartCount();
      }

      function updateCartCount() {
        const cart = loadCart();
        const total = cart.reduce((sum, item) => sum + item.quantity, 0);
        if (cartCountEl) cartCountEl.textContent = total;
      }

      function addToCart(id, qty) {
        qty = Math.max(1, parseInt(qty) || 1);
        const p = products.find(x => x.id === id);
        if (!p) return;
        const cart = loadCart();
        const existing = cart.find(item => item.id === id);
        if (existing) {
          existing.quantity += qty;
        } else {
          cart.push({ ...p, quantity: qty });
        }
        saveCart(cart);
        showToast(`${p.name} (x${qty}) added to cart`);
      }

      window.addToCart = addToCart;

      // ----- update selected count -----
      function updateSelectedCount() {
        const checkboxes = document.querySelectorAll('.product-checkbox');
        const checked = document.querySelectorAll('.product-checkbox:checked');
        if (selectedCountEl) selectedCountEl.textContent = checked.length;

        // highlight selected cards
        checkboxes.forEach(cb => {
          const card = cb.closest('.product-card');
          if (card) {
            if (cb.checked) {
              card.classList.add('selected');
            } else {
              card.classList.remove('selected');
            }
          }
        });
      }

      // ----- render -----
      function renderProducts() {
        let html = '';
        products.forEach((product, index) => {
          const rank = index + 1;

          html += `
            <div class="product-card" data-id="${product.id}">
              <div class="product-badge"><i class="fas fa-fire"></i> ${product.badge || 'Popular'}</div>
              
              <!-- checkbox juu kulia -->
              <div class="select-checkbox-wrapper">
                <label>
                  <input type="checkbox" class="product-checkbox" data-id="${product.id}" />
                  <span>Select</span>
                </label>
              </div>

              <div class="product-image" style="background-image: url('${product.image}');">
                <div class="overlay">
                  <span class="price-tag">$${product.price.toFixed(2)}</span>
                  <span class="category-tag"><i class="fas fa-tag"></i> ${product.category}</span>
                </div>
              </div>
              <div class="product-info">
                <div class="product-name">${product.name}</div>
                <div class="product-category"><i class="fas fa-tag"></i> ${product.category.charAt(0).toUpperCase() + product.category.slice(1)}</div>
                <div class="product-price">
                  $${product.price.toFixed(2)}
                  ${product.originalPrice ? `<span class="original-price">$${product.originalPrice.toFixed(2)}</span>` : ''}
                </div>

                <!-- quantity control -->
                <div class="qty-control">
                  <label for="qty-${product.id}"><i class="fas fa-hashtag"></i> Qty</label>
                  <input type="number" id="qty-${product.id}" min="1" value="1" />
                </div>
              </div>
            </div>
          `;
        });

        grid.innerHTML = html;

        // attach checkbox events
        document.querySelectorAll('.product-checkbox').forEach(cb => {
          cb.addEventListener('change', updateSelectedCount);
        });

        updateSelectedCount();
      }

      // ----- add selected -----
      addBtn.addEventListener('click', () => {
        const checked = document.querySelectorAll('.product-checkbox:checked');
        if (checked.length === 0) {
          showToast('No products selected');
          return;
        }

        let added = 0;
        checked.forEach(cb => {
          const id = parseInt(cb.dataset.id);
          const qtyInput = document.getElementById(`qty-${id}`);
          const qty = qtyInput ? parseInt(qtyInput.value) || 1 : 1;
          const p = products.find(x => x.id === id);
          if (p) {
            const cart = loadCart();
            const existing = cart.find(item => item.id === id);
            if (existing) {
              existing.quantity += qty;
            } else {
              cart.push({ ...p, quantity: qty });
            }
            saveCart(cart);
            added++;
          }
        });

        showToast(`${added} product${added > 1 ? 's' : ''} added to cart`);

        // uncheck all after adding
        document.querySelectorAll('.product-checkbox').forEach(cb => cb.checked = false);
        updateSelectedCount();
      });

      // ----- select all -----
      selectAllBtn.addEventListener('click', () => {
        document.querySelectorAll('.product-checkbox').forEach(cb => cb.checked = true);
        updateSelectedCount();
        showToast('All products selected');
      });

      // ----- clear selection -----
      clearBtn.addEventListener('click', () => {
        document.querySelectorAll('.product-checkbox').forEach(cb => cb.checked = false);
        document.querySelectorAll('.qty-control input[type="number"]').forEach(inp => inp.value = 1);
        updateSelectedCount();
        showToast('Selection cleared');
      });

      // ----- toast notification -----
      function showToast(msg) {
        const t = document.createElement('div');
        t.textContent = msg;
        t.style.cssText = 'position:fixed;bottom:1.6rem;left:50%;transform:translateX(-50%);background:#1e1e30;color:#fff;padding:.7rem 1.2rem;border-radius:1.2rem;border:1px solid rgba(255,140,66,0.2);z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,0.6);';
        document.body.appendChild(t);
        setTimeout(() => {
          t.style.opacity = '0';
          t.style.transition = 'opacity .3s';
          setTimeout(() => t.remove(), 300);
        }, 1800);
      }

      // ----- initial render -----
      renderProducts();
      updateCartCount();

      console.log('Select page loaded with checkbox on top-right and quantity control.');
    })();
  </script>
</body>
</html>
