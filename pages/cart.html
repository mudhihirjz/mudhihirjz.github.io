<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cart · New Class</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f17;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* header */
        .cart-header {
            background: #12121f;
            padding: 1.2rem 2rem;
            border-bottom: 3px solid #ff8c42;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .cart-header .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .cart-header .logo-area h2 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(to right, #ff8c42, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .back-home {
            background: rgba(255, 140, 66, 0.15);
            border: 1px solid #ff8c42;
            color: #ff8c42;
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            transition: 0.25s ease;
            font-size: 0.95rem;
        }

        .back-home:hover {
            background: #ff8c42;
            color: #0a0a10;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 140, 66, 0.4);
        }

        .cart-count-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(255, 140, 66, 0.12);
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            border: 1px solid rgba(255, 140, 66, 0.2);
            font-size: 0.9rem;
            color: #ff8c42;
        }

        .cart-count-badge i {
            font-size: 1rem;
        }

        /* main container */
        .cart-container {
            flex: 1;
            max-width: 1100px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 2rem;
        }

        /* cart items */
        .cart-items-section h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            color: #f0e6ff;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .cart-items-section h3 i {
            color: #ff8c42;
        }

        .cart-item {
            background: #1e1e30;
            border-radius: 1.5rem;
            padding: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 1.2rem;
            margin-bottom: 1rem;
            transition: 0.25s ease;
        }

        .cart-item:hover {
            border-color: rgba(255, 140, 66, 0.2);
        }

        .cart-item .item-image {
            width: 80px;
            height: 80px;
            border-radius: 1rem;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
            background-color: #2a2a3e;
        }

        .cart-item .item-details {
            flex: 1;
            min-width: 0;
        }

        .cart-item .item-details .item-name {
            font-size: 1rem;
            font-weight: 700;
            color: #f0e6ff;
        }

        .cart-item .item-details .item-category {
            font-size: 0.8rem;
            color: #8888a0;
        }

        .cart-item .item-details .item-price {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ff8c42;
            margin-top: 0.2rem;
        }

        .cart-item .item-actions {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .cart-item .item-actions .qty-control {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 2rem;
            padding: 0.2rem 0.3rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .cart-item .item-actions .qty-control button {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.04);
            color: #b0b0c8;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cart-item .item-actions .qty-control button:hover {
            background: rgba(255, 140, 66, 0.15);
            color: #ff8c42;
        }

        .cart-item .item-actions .qty-control .qty-number {
            font-weight: 700;
            color: #f0e6ff;
            width: 30px;
            text-align: center;
            font-size: 1rem;
        }

        .cart-item .item-actions .remove-btn {
            background: rgba(255, 59, 48, 0.08);
            border: 1px solid rgba(255, 59, 48, 0.1);
            color: #ff3b30;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.8rem;
            transition: 0.2s;
        }

        .cart-item .item-actions .remove-btn:hover {
            background: rgba(255, 59, 48, 0.15);
            border-color: rgba(255, 59, 48, 0.3);
        }

        .cart-item .item-total {
            font-weight: 700;
            color: #ff8c42;
            font-size: 1.1rem;
            text-align: right;
            min-width: 80px;
        }

        /* empty cart */
        .empty-cart {
            text-align: center;
            padding: 4rem 1rem;
            background: #1a1a28;
            border-radius: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .empty-cart i {
            font-size: 4rem;
            color: #33334a;
            margin-bottom: 1rem;
            display: block;
        }

        .empty-cart h3 {
            font-size: 1.4rem;
            color: #8888a0;
            margin-bottom: 0.5rem;
        }

        .empty-cart p {
            color: #66667a;
            font-size: 0.95rem;
        }

        .empty-cart .shop-now-btn {
            display: inline-block;
            margin-top: 1.5rem;
            background: #ff8c42;
            color: #0a0a10;
            padding: 0.8rem 2rem;
            border-radius: 2rem;
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s;
        }

        .empty-cart .shop-now-btn:hover {
            background: #ffaa5e;
            transform: translateY(-2px);
        }

        /* cart summary */
        .cart-summary {
            background: #1a1a28;
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 140, 66, 0.1);
            align-self: start;
            position: sticky;
            top: 2rem;
        }

        .cart-summary h4 {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f0e6ff;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .cart-summary h4 i {
            color: #ff8c42;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0;
            font-size: 0.95rem;
            color: #b0b0c8;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .summary-row.total {
            font-size: 1.2rem;
            font-weight: 700;
            color: #f0e6ff;
            border-bottom: none;
            padding-top: 1rem;
            margin-top: 0.5rem;
            border-top: 2px solid rgba(255, 140, 66, 0.2);
        }

        .summary-row.total .amount {
            color: #ff8c42;
        }

        .whatsapp-btn {
            width: 100%;
            margin-top: 1.2rem;
            padding: 1rem;
            border: none;
            border-radius: 2rem;
            background: #25d366;
            color: #0a0a10;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .whatsapp-btn:hover {
            background: #20b85a;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(37, 211, 102, 0.3);
        }

        .whatsapp-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .whatsapp-btn i {
            font-size: 1.3rem;
        }

        .continue-shopping {
            display: block;
            text-align: center;
            margin-top: 1rem;
            color: #8888a0;
            font-size: 0.9rem;
            text-decoration: none;
            transition: 0.2s;
        }

        .continue-shopping:hover {
            color: #ff8c42;
        }

        /* delivery note */
        .delivery-note {
            background: rgba(255, 140, 66, 0.06);
            border-radius: 1rem;
            padding: 0.8rem 1rem;
            margin-top: 1rem;
            border: 1px solid rgba(255, 140, 66, 0.1);
            font-size: 0.85rem;
            color: #8888a0;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .delivery-note i {
            color: #ff8c42;
            font-size: 1rem;
        }

        /* footer */
        .footer-note {
            background: #0f0f1a;
            padding: 1rem 2rem;
            text-align: center;
            border-top: 1px solid rgba(255, 140, 66, 0.15);
            font-size: 0.85rem;
            color: #77778f;
            margin-top: auto;
        }
        .footer-note i {
            color: #ff8c42;
        }

        /* responsive */
        @media (max-width: 820px) {
            .cart-container {
                grid-template-columns: 1fr;
                gap: 1.5rem;
                padding: 1.2rem 1rem;
            }
            .cart-summary {
                position: static;
            }
            .cart-header {
                flex-direction: column;
                align-items: flex-start;
                padding: 1rem 1.5rem;
            }
        }

        @media (max-width: 600px) {
            .cart-item {
                flex-wrap: wrap;
                gap: 0.8rem;
            }
            .cart-item .item-image {
                width: 60px;
                height: 60px;
            }
            .cart-item .item-actions {
                width: 100%;
                justify-content: space-between;
            }
            .cart-item .item-total {
                text-align: left;
                min-width: auto;
            }
            .cart-item .item-details .item-name {
                font-size: 0.9rem;
            }
        }

        @media (max-width: 400px) {
            .cart-item .item-actions {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }
            .cart-item .item-actions .qty-control {
                align-self: center;
            }
            .cart-item .item-actions .remove-btn {
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- header -->
    <header class="cart-header">
        <div class="logo-area">
            <h2><i class="fas fa-shopping-cart" style="background:transparent; -webkit-text-fill-color:#ff8c42; margin-right:0.3rem;"></i> Cart</h2>
            <a href="#" class="back-home" onclick="window.history.back(); return false;">
                <i class="fas fa-arrow-left"></i> Back
            </a>
        </div>
        <div class="cart-count-badge">
            <i class="fas fa-shopping-bag"></i>
            <span id="cartItemCount">0</span> items
        </div>
    </header>

    <!-- main content -->
    <div class="cart-container">
        <!-- Cart Items -->
        <div class="cart-items-section">
            <h3><i class="fas fa-box"></i> Your Cart</h3>
            <div id="cartItemsList">
                <!-- rendered by JS -->
            </div>
        </div>

        <!-- Cart Summary -->
        <div class="cart-summary">
            <h4><i class="fas fa-receipt"></i> Order Summary</h4>
            <div class="summary-row">
                <span>Subtotal</span>
                <span id="subtotalAmount">$0.00</span>
            </div>
            <div class="summary-row">
                <span>Delivery Fee</span>
                <span id="shippingAmount">$0.00</span>
            </div>
            <div class="summary-row total">
                <span>Total</span>
                <span class="amount" id="totalAmount">$0.00</span>
            </div>

            <!-- Delivery Info Form -->
            <div style="margin-bottom:0.6rem;">
                <h5 style="margin:0 0 0.6rem 0;color:#ddd;font-size:0.95rem;font-weight:700">Delivery Information</h5>
                <div id="deliveryForm" style="display:flex;flex-direction:column;gap:0.5rem;">
                    <input id="delName" type="text" placeholder="Full name" style="padding:0.6rem;border-radius:0.6rem;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#f0f0f0;font-weight:600;" />
                    <input id="delPhone" type="tel" placeholder="Phone number" style="padding:0.6rem;border-radius:0.6rem;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#f0f0f0;font-weight:600;" />
                    <input id="delAddress" type="text" placeholder="Address (street / house)" style="padding:0.6rem;border-radius:0.6rem;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#f0f0f0;font-weight:600;" />
                    <input id="delRegion" type="text" placeholder="Region / City" style="padding:0.6rem;border-radius:0.6rem;border:1px solid rgba(255,255,255,0.06);background:transparent;color:#f0f0f0;font-weight:600;" />
                </div>
            </div>

            <!-- WhatsApp Order Button -->
            <button class="whatsapp-btn" id="whatsappOrderBtn">
                <i class="fab fa-whatsapp"></i> Order via WhatsApp
            </button>

            <div class="delivery-note">
                <i class="fas fa-truck"></i>
                <span>Delivery fee calculated based on your location. You'll confirm with us on WhatsApp.</span>
            </div>

            <a class="continue-shopping" href="shop.html">
                <i class="fas fa-arrow-left"></i> Continue Shopping
            </a>
        </div>
    </div>

    <div class="footer-note">
        <i class="fab fa-whatsapp"></i>  order via WhatsApp · quick & easy
    </div>

    <script>
        (function() {
            // ----- Load cart from localStorage -----
            function loadCart() {
                try { return JSON.parse(localStorage.getItem('nc_cart') || '[]'); }
                catch (e) { return []; }
            }
            function saveCart(cart) {
                localStorage.setItem('nc_cart', JSON.stringify(cart));
            }

            let cart = loadCart();

            // DOM refs
            const cartList = document.getElementById('cartItemsList');
            const subtotalEl = document.getElementById('subtotalAmount');
            const shippingEl = document.getElementById('shippingAmount');
            const totalEl = document.getElementById('totalAmount');
            const cartCountEl = document.getElementById('cartItemCount');
            const whatsappBtn = document.getElementById('whatsappOrderBtn');

            const DELIVERY_FEE = 5.00;
            const WHATSAPP_NUMBER = '255671533265'; // Replace with your actual WhatsApp number

            // Delivery info (persisted)
            function loadDeliveryInfo() {
                try { return JSON.parse(localStorage.getItem('nc_delivery') || '{}'); }
                catch (e) { return {}; }
            }
            function saveDeliveryInfo(info) { localStorage.setItem('nc_delivery', JSON.stringify(info)); }

            // ----- Render cart -----
            function renderCart() {
                if (cart.length === 0) {
                    cartList.innerHTML = `
                        <div class="empty-cart">
                            <i class="fas fa-shopping-cart"></i>
                            <h3>Your cart is empty</h3>
                            <p>Looks like you haven't added any items yet.</p>
                            <a href="shop.html" class="shop-now-btn">Start Shopping</a>
                        </div>
                    `;
                    updateSummary();
                    return;
                }

                let html = '';
                cart.forEach((item, index) => {
                    const itemTotal = (item.price * item.quantity).toFixed(2);
                    html += `
                        <div class="cart-item" data-id="${item.id}">
                            <div class="item-image" style="background-image: url('${item.image}');"></div>
                            <div class="item-details">
                                <div class="item-name">${item.name}</div>
                                <div class="item-category"><i class="fas fa-tag"></i> ${item.category}</div>
                                <div class="item-price">$${item.price.toFixed(2)}</div>
                            </div>
                            <div class="item-actions">
                                <div class="qty-control">
                                    <button onclick="updateQuantity(${index}, -1)" aria-label="Decrease quantity">−</button>
                                    <span class="qty-number">${item.quantity}</span>
                                    <button onclick="updateQuantity(${index}, 1)" aria-label="Increase quantity">+</button>
                                </div>
                                <button class="remove-btn" onclick="removeItem(${index})">
                                    <i class="fas fa-trash"></i> Remove
                                </button>
                            </div>
                            <div class="item-total">$${itemTotal}</div>
                        </div>
                    `;
                });

                cartList.innerHTML = html;
                saveCart(cart);
                updateSummary();
                updateCartCount();
            }

            // ----- Update quantity -----
            window.updateQuantity = function(index, change) {
                if (index < 0 || index >= cart.length) return;
                const newQty = cart[index].quantity + change;
                if (newQty < 1) {
                    removeItem(index);
                    return;
                }
                cart[index].quantity = newQty;
                saveCart(cart);
                renderCart();
            };

            // ----- Remove item -----
            window.removeItem = function(index) {
                if (index < 0 || index >= cart.length) return;
                if (confirm(`Remove "${cart[index].name}" from your cart?`)) {
                    cart.splice(index, 1);
                    saveCart(cart);
                    renderCart();
                    showToast('Item removed from cart');
                }
            };

            // ----- Update summary -----
            function updateSummary() {
                let subtotal = 0;
                cart.forEach(item => {
                    subtotal += item.price * item.quantity;
                });

                const delivery = cart.length > 0 ? DELIVERY_FEE : 0;
                const total = subtotal + delivery;

                subtotalEl.textContent = `$${subtotal.toFixed(2)}`;
                shippingEl.textContent = cart.length > 0 ? `$${delivery.toFixed(2)}` : '$0.00';
                totalEl.textContent = `$${total.toFixed(2)}`;

                // Enable/disable WhatsApp button
                whatsappBtn.disabled = cart.length === 0;
            }

            // ----- Update cart count -----
            function updateCartCount() {
                let count = 0;
                cart.forEach(item => {
                    count += item.quantity;
                });
                cartCountEl.textContent = count;
            }

            // ----- Delivery form binding -----
            const delNameEl = document.getElementById('delName');
            const delPhoneEl = document.getElementById('delPhone');
            const delAddressEl = document.getElementById('delAddress');
            const delRegionEl = document.getElementById('delRegion');

            function populateDeliveryForm() {
                const info = loadDeliveryInfo();
                if (info.name) delNameEl.value = info.name;
                if (info.phone) delPhoneEl.value = info.phone;
                if (info.address) delAddressEl.value = info.address;
                if (info.region) delRegionEl.value = info.region;
            }

            [delNameEl, delPhoneEl, delAddressEl, delRegionEl].forEach(el => {
                el.addEventListener('input', () => {
                    saveDeliveryInfo({
                        name: delNameEl.value.trim(),
                        phone: delPhoneEl.value.trim(),
                        address: delAddressEl.value.trim(),
                        region: delRegionEl.value.trim()
                    });
                });
            });

            populateDeliveryForm();

            // ----- Generate WhatsApp message -----
            function generateWhatsAppMessage() {
                if (cart.length === 0) return '';

                let message = 'Hello New Class! I would like to place an order:\n\n';
                message += '🛒 *MY ORDER*\n';
                message += '━━━━━━━━━━━━━━━━━\n\n';

                cart.forEach((item, index) => {
                    const itemTotal = (item.price * item.quantity).toFixed(2);
                    message += `${index + 1}. ${item.name}\n`;
                    message += `   Quantity: ${item.quantity} × $${item.price.toFixed(2)} = $${itemTotal}\n\n`;
                });

                const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                const delivery = DELIVERY_FEE;
                const total = subtotal + delivery;

                message += '━━━━━━━━━━━━━━━━━\n';
                message += `📊 Subtotal: $${subtotal.toFixed(2)}\n`;
                message += `🚚 Delivery: $${delivery.toFixed(2)}\n`;
                message += `💰 TOTAL: $${total.toFixed(2)}\n\n`;
                message += '━━━━━━━━━━━━━━━━━\n\n';
                // include filled delivery info if available
                const delInfo = loadDeliveryInfo();
                message += '📍 *Delivery Information*\n';
                message += `Name: ${delInfo.name || ''}\n`;
                message += `Phone: ${delInfo.phone || ''}\n`;
                message += `Address: ${delInfo.address || ''}\n`;
                message += `Region: ${delInfo.region || ''}\n\n`;
                message += 'Thank you! 🙏';

                return message;
            }

            // ----- WhatsApp Order Button -----
            whatsappBtn.addEventListener('click', function() {
                if (cart.length === 0) {
                    showToast('Your cart is empty!');
                    return;
                }

                const delInfo = loadDeliveryInfo();
                if (!delInfo.name || !delInfo.phone) {
                    showToast('Please enter your name and phone for delivery');
                    if (!delInfo.name) delNameEl.focus(); else delPhoneEl.focus();
                    return;
                }

                const message = generateWhatsAppMessage();
                const encodedMessage = encodeURIComponent(message);
                const whatsappURL = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`;

                // Open WhatsApp in new tab
                window.open(whatsappURL, '_blank');

                // Optional: show toast
                showToast('Opening WhatsApp...');
            });

            // ----- Toast notification -----
            function showToast(message) {
                const existing = document.querySelector('.custom-toast');
                if (existing) existing.remove();

                const toast = document.createElement('div');
                toast.className = 'custom-toast';
                toast.style.cssText = `
                    position: fixed;
                    bottom: 2rem;
                    left: 50%;
                    transform: translateX(-50%);
                    background: #1e1e30;
                    color: #f0f0f0;
                    padding: 0.8rem 2rem;
                    border-radius: 2rem;
                    border: 1px solid rgba(255, 140, 66, 0.3);
                    box-shadow: 0 12px 30px rgba(0,0,0,0.6);
                    font-weight: 600;
                    font-size: 0.95rem;
                    z-index: 9999;
                    backdrop-filter: blur(12px);
                    max-width: 90%;
                    text-align: center;
                    animation: slideUp 0.4s ease;
                `;
                toast.textContent = message;

                if (!document.getElementById('toastStyles')) {
                    const style = document.createElement('style');
                    style.id = 'toastStyles';
                    style.textContent = `
                        @keyframes slideUp {
                            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
                            to { opacity: 1; transform: translateX(-50%) translateY(0); }
                        }
                    `;
                    document.head.appendChild(style);
                }

                document.body.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transition = 'opacity 0.4s ease';
                    setTimeout(() => toast.remove(), 400);
                }, 3000);
            }

            // ----- Initial render -----
            renderCart();

            console.log('Cart page loaded with ' + cart.length + ' items. WhatsApp integration ready.');
        })();
    </script>
</body>
</html>
