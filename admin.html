<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Admin · New Class</title>
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0f0f17;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ===== LOGIN PAGE ===== */
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            background: linear-gradient(135deg, #0f0f17 0%, #1a1a2e 100%);
        }

        .login-box {
            background: #1a1a28;
            border-radius: 2.5rem;
            padding: 3rem 2.5rem;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 140, 66, 0.15);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .login-box .logo {
            text-align: center;
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(to right, #ff8c42, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.3rem;
        }

        .login-box .subtitle {
            text-align: center;
            color: #8888a0;
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .login-box .form-group {
            margin-bottom: 1.2rem;
        }

        .login-box .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: #b0b0c8;
            margin-bottom: 0.3rem;
        }

        .login-box .form-group input {
            width: 100%;
            padding: 0.8rem 1.2rem;
            border-radius: 1.5rem;
            border: 1px solid rgba(255, 140, 66, 0.15);
            background: #252536;
            color: #f0f0f0;
            font-size: 1rem;
            outline: none;
            transition: 0.2s;
        }

        .login-box .form-group input:focus {
            border-color: #ff8c42;
            box-shadow: 0 0 0 3px rgba(255, 140, 66, 0.15);
        }

        .login-box .login-btn {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 2rem;
            background: #ff8c42;
            color: #0a0a10;
            font-weight: 700;
            font-size: 1.05rem;
            cursor: pointer;
            transition: 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .login-box .login-btn:hover {
            background: #ffaa5e;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 140, 66, 0.3);
        }

        .login-box .toggle-auth {
            text-align: center;
            margin-top: 1.2rem;
            color: #8888a0;
            font-size: 0.9rem;
        }

        .login-box .toggle-auth a {
            color: #ff8c42;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }

        .login-box .toggle-auth a:hover {
            text-decoration: underline;
        }

        .login-box .error-msg {
            background: rgba(255, 59, 48, 0.1);
            border: 1px solid rgba(255, 59, 48, 0.2);
            color: #ff3b30;
            padding: 0.6rem 1rem;
            border-radius: 1rem;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .login-box .error-msg.show {
            display: block;
        }

        /* ===== ADMIN DASHBOARD ===== */
        .admin-dashboard {
            display: none;
            min-height: 100vh;
        }

        .admin-dashboard.active {
            display: flex;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            background: #12121f;
            border-right: 1px solid rgba(255, 140, 66, 0.1);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar .sidebar-brand {
            padding: 1.5rem 1.5rem 1rem 1.5rem;
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(to right, #ff8c42, #ffb347);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .sidebar .sidebar-brand i {
            -webkit-text-fill-color: #ff8c42;
            font-size: 1.4rem;
        }

        .sidebar .sidebar-nav {
            padding: 1rem 0.8rem;
            flex: 1;
        }

        .sidebar .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.7rem 1.2rem;
            border-radius: 1.2rem;
            color: #8888a0;
            text-decoration: none;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 0.2rem;
            font-weight: 500;
        }

        .sidebar .sidebar-nav .nav-item:hover {
            background: rgba(255, 140, 66, 0.08);
            color: #f0f0f0;
        }

        .sidebar .sidebar-nav .nav-item.active {
            background: rgba(255, 140, 66, 0.12);
            color: #ff8c42;
            border: 1px solid rgba(255, 140, 66, 0.15);
        }

        .sidebar .sidebar-nav .nav-item i {
            width: 22px;
            text-align: center;
            font-size: 1.05rem;
        }

        .sidebar .sidebar-nav .nav-item .badge {
            margin-left: auto;
            background: rgba(255, 140, 66, 0.15);
            color: #ff8c42;
            font-size: 0.7rem;
            padding: 0.1rem 0.6rem;
            border-radius: 1rem;
            font-weight: 700;
        }

        .sidebar .sidebar-footer {
            padding: 1rem 1.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .sidebar .sidebar-footer .logout-btn {
            width: 100%;
            padding: 0.6rem;
            border: 1px solid rgba(255, 59, 48, 0.2);
            border-radius: 1.5rem;
            background: rgba(255, 59, 48, 0.06);
            color: #ff3b30;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .sidebar .sidebar-footer .logout-btn:hover {
            background: rgba(255, 59, 48, 0.12);
            border-color: rgba(255, 59, 48, 0.3);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 2rem 2rem 3rem 2rem;
            overflow-y: auto;
            background: #0f0f17;
        }

        .main-content .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .main-content .page-header h2 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #f0e6ff;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .main-content .page-header h2 i {
            color: #ff8c42;
        }

        .main-content .page-header .header-actions {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .main-content .page-header .header-actions .btn {
            padding: 0.6rem 1.2rem;
            border-radius: 2rem;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .main-content .page-header .header-actions .btn-primary {
            background: #ff8c42;
            color: #0a0a10;
        }

        .main-content .page-header .header-actions .btn-primary:hover {
            background: #ffaa5e;
            transform: translateY(-2px);
        }

        .main-content .page-header .header-actions .btn-danger {
            background: rgba(255, 59, 48, 0.12);
            color: #ff3b30;
            border: 1px solid rgba(255, 59, 48, 0.15);
        }

        .main-content .page-header .header-actions .btn-danger:hover {
            background: rgba(255, 59, 48, 0.2);
        }

        /* Stats Cards */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: #1a1a28;
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stat-card .stat-number {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ff8c42;
        }

        .stat-card .stat-label {
            font-size: 0.85rem;
            color: #8888a0;
        }

        .stat-card .stat-icon {
            float: right;
            font-size: 2rem;
            color: rgba(255, 140, 66, 0.15);
        }

        /* Tables */
        .table-container {
            background: #1a1a28;
            border-radius: 1.5rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.04);
            overflow-x: auto;
        }

        .table-container table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }

        .table-container table th {
            text-align: left;
            padding: 0.7rem 0.5rem;
            color: #8888a0;
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .table-container table td {
            padding: 0.7rem 0.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            color: #d0d0e0;
        }

        .table-container table td .actions {
            display: flex;
            gap: 0.5rem;
        }

        .table-container table td .actions button {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            padding: 0.2rem 0.5rem;
            border-radius: 0.5rem;
            transition: 0.2s;
        }

        .table-container table td .actions .edit-btn {
            color: #2d8cff;
        }

        .table-container table td .actions .edit-btn:hover {
            background: rgba(45, 140, 255, 0.1);
        }

        .table-container table td .actions .delete-btn {
            color: #ff3b30;
        }

        .table-container table td .actions .delete-btn:hover {
            background: rgba(255, 59, 48, 0.1);
        }

        .table-container .empty-state {
            text-align: center;
            padding: 2rem 0;
            color: #66667a;
        }

        .table-container .empty-state i {
            font-size: 2.5rem;
            color: #33334a;
            display: block;
            margin-bottom: 0.5rem;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #1e1e30;
            border-radius: 2rem;
            padding: 2rem;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255, 140, 66, 0.15);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
        }

        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-box .modal-header h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #f0e6ff;
        }

        .modal-box .modal-header .close-modal {
            background: none;
            border: none;
            color: #8888a0;
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0.2rem 0.5rem;
            border-radius: 0.5rem;
            transition: 0.2s;
        }

        .modal-box .modal-header .close-modal:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .modal-box .form-group {
            margin-bottom: 1rem;
        }

        .modal-box .form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            color: #b0b0c8;
            margin-bottom: 0.2rem;
        }

        .modal-box .form-group input,
        .modal-box .form-group select,
        .modal-box .form-group textarea {
            width: 100%;
            padding: 0.7rem 1rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: #252536;
            color: #f0f0f0;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }

        .modal-box .form-group textarea {
            resize: vertical;
            min-height: 60px;
        }

        /* small helper text shown under inputs */
        .help-text {
            color: #9b9bb0;
            font-size: 0.8rem;
            margin-top: 0.25rem;
            display: block;
        }

        /* short help line shown in modal header area */
        .modal-help {
            color: #bdbdd0;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
        }

        .modal-box .form-group input:focus,
        .modal-box .form-group select:focus,
        .modal-box .form-group textarea:focus {
            border-color: #ff8c42;
            box-shadow: 0 0 0 3px rgba(255, 140, 66, 0.1);
        }

        .modal-box .form-group select option {
            background: #252536;
        }

        .modal-box .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .modal-box .modal-actions {
            display: flex;
            gap: 0.8rem;
            margin-top: 1.5rem;
        }

        .modal-box .modal-actions button {
            flex: 1;
            padding: 0.7rem;
            border-radius: 1.5rem;
            border: none;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-box .modal-actions .cancel-btn {
            background: rgba(255, 255, 255, 0.04);
            color: #b0b0c8;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .modal-box .modal-actions .cancel-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .modal-box .modal-actions .save-btn {
            background: #ff8c42;
            color: #0a0a10;
        }

        .modal-box .modal-actions .save-btn:hover {
            background: #ffaa5e;
        }

        /* Toast */
        .custom-toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: #1e1e30;
            color: #f0f0f0;
            padding: 0.8rem 2rem;
            border-radius: 2rem;
            border: 1px solid rgba(255, 140, 66, 0.3);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            font-weight: 600;
            font-size: 0.95rem;
            z-index: 99999;
            backdrop-filter: blur(12px);
            max-width: 90%;
            text-align: center;
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Responsive */
        @media (max-width: 820px) {
            .sidebar {
                width: 60px;
                padding: 0;
            }
            .sidebar .sidebar-brand span {
                display: none;
            }
            .sidebar .sidebar-brand i {
                font-size: 1.6rem;
            }
            .sidebar .sidebar-brand {
                justify-content: center;
                padding: 1rem;
            }
            .sidebar .sidebar-nav .nav-item span {
                display: none;
            }
            .sidebar .sidebar-nav .nav-item {
                justify-content: center;
                padding: 0.7rem;
            }
            .sidebar .sidebar-nav .nav-item .badge {
                display: none;
            }
            .sidebar .sidebar-footer .logout-btn span {
                display: none;
            }
            .sidebar .sidebar-footer .logout-btn {
                justify-content: center;
                padding: 0.6rem;
            }
            .main-content {
                padding: 1.2rem 1rem 2rem 1rem;
            }
            .login-box {
                padding: 2rem 1.5rem;
            }
            .modal-box {
                padding: 1.5rem;
                margin: 1rem;
            }
            .modal-box .form-row {
                grid-template-columns: 1fr;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .sidebar {
                width: 50px;
            }
            .main-content .page-header h2 {
                font-size: 1.3rem;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr;
                gap: 0.8rem;
            }
            .stat-card {
                padding: 1rem;
            }
            .stat-card .stat-number {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN PAGE ===== -->
    <div class="login-page" id="loginPage">
        <div class="login-box">
            <div class="logo"><i class="fas fa-crown"></i> NEW CLASS</div>
            <div class="subtitle">Admin Dashboard</div>

            <div class="error-msg" id="loginError">Invalid email or password</div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="loginEmail" placeholder="admin@newclass.com" value="admin@newclass.com" />
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" placeholder="••••••••" value="admin123" />
            </div>

            <button class="login-btn" id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>

            <div class="toggle-auth">
                Don't have an account? <a id="showRegister">Register</a>
            </div>
        </div>
    </div>

    <!-- ===== ADMIN DASHBOARD ===== -->
    <div class="admin-dashboard" id="adminDashboard">
        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-brand">
                <i class="fas fa-crown"></i>
                <span>New Class</span>
            </div>
            <div class="sidebar-nav">
                <div class="nav-item active" data-page="dashboard"><i class="fas fa-chart-pie"></i> <span>Dashboard</span></div>
                <div class="nav-item" data-page="products"><i class="fas fa-box"></i> <span>Products</span> <span class="badge" id="productCount">0</span></div>
                <div class="nav-item" data-page="slider"><i class="fas fa-images"></i> <span>Slider</span> <span class="badge" id="sliderCount">0</span></div>
                <div class="nav-item" data-page="flipcards"><i class="fas fa-layer-group"></i> <span>Flip Cards</span></div>
                <div class="nav-item" data-page="banner"><i class="fas fa-bullhorn"></i> <span>Banner</span></div>
                <div class="nav-item" data-page="branches"><i class="fas fa-store"></i> <span>Branches</span> <span class="badge" id="branchCount">0</span></div>
                <div class="nav-item" data-page="media"><i class="fas fa-photo-video"></i> <span>Media</span> <span class="badge" id="mediaCount">0</span></div>
                <div class="nav-item" data-page="popular"><i class="fas fa-fire"></i> <span>Popular</span> <span class="badge" id="popularCount">0</span></div>
                <div class="nav-item" data-page="community"><i class="fas fa-users"></i> <span>Community</span></div>
                <div class="nav-item" data-page="faq"><i class="fas fa-question-circle"></i> <span>FAQ</span> <span class="badge" id="faqCount">0</span></div>
            </div>
            <div class="sidebar-footer">
                <button class="logout-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> <span>Logout</span></button>
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content" id="mainContent">
            <!-- Content rendered by JS -->
        </div>
    </div>

    <!-- ===== MODAL ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Add New</h3>
                <button class="close-modal" id="closeModalBtn"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-help" id="modalHelp">Fields marked with * are required. Use full URLs for image/file fields.</div>
            <div id="modalBody">
                <!-- Rendered by JS -->
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ============================================================
            // 1. DATA STORE (LocalStorage)
            // ============================================================
            function getStore(key, defaultValue) {
                try {
                    const data = localStorage.getItem('admin_' + key);
                    return data ? JSON.parse(data) : defaultValue;
                } catch (e) {
                    return defaultValue;
                }
            }

            function setStore(key, value) {
                localStorage.setItem('admin_' + key, JSON.stringify(value));
            }

            // ----- Default Data -----
            const defaultProducts = [
                { id: 1, name: "Rustic Wall Clock", category: "Decor", price: "45.00", image: "https://images.unsplash.com/photo-1563861826100-9cb868fdbe1c?q=80&w=2070&auto=format&fit=crop",
                badge: "new" },
                { id: 2, name: "Ceramic Vase Set", category: "Decor", price: "32.50", image: "https://images.unsplash.com/photo-1586023492125-27b2c045efd7?q=80&w=2058&auto=format&fit=crop",
                    badge: "sale" },
                { id: 3, name: "Santal & Wood", category: "Perfume", price: "68.00", image: "https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=2069&auto=format&fit=crop",
                    badge: "popular" },
            ];

            const defaultSlides = [
                { id: 1, title: "Mountain Wilderness", description: "Explore breathtaking alpine landscapes.", buttonText: "Discover",
                    image: "https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=2070&auto=format&fit=crop" },
                { id: 2, title: "Coastal Sunsets", description: "Golden horizons and calming ocean waves.",
                    buttonText: "View more",
                    image: "https://images.unsplash.com/photo-1501594907352-04cda38ebc29?q=80&w=1932&auto=format&fit=crop" },
                { id: 3, title: "Forest Retreat", description: "Find peace among ancient trees.", buttonText: "Explore",

                if (id > 0) {

                        products[index] = { ...products[index], name, category, price, image, badge };
                        setStore('products', products);

                    setStore('products', products);
                    showToast('Product added successfully!');

                        </div>
                        <button class="btn btn-primary" onclick="addValue()" style="padding:0.4rem 1rem; border-radius:1rem; border:none; background:rgba(255,140,66,0.15); color:#ff8c42; cursor:pointer;"><i class="fas fa-plus"></i> Add Value</button>

                        <h4 style="color:#f0e6ff; margin:1.5rem 0 0.5rem 0;"><i class="fas fa-map" style="color:#ff8c42;"></i> Regions</h4>
                        <div class="form-group">
                            <textarea id="regionsInput" rows="3" style="width:100%; padding:0.8rem 1rem; border-radius:1rem; border:1px solid rgba(255,255,255,0.06); background:#252536; color:#f0f0f0; font-size:0.95rem; font-family:inherit;">${data.regions.join(', ')}</textarea>
                            <small style="color:#66667a;">Separate regions with commas</small>
                        </div>

                        <button class="btn btn-primary" onclick="saveCommunity()" style="margin-top:1rem; padding:0.8rem 2rem; border-radius:2rem; border:none; background:#ff8c42; color:#0a0a10; font-weight:700; cursor:pointer;"><i class="fas fa-save"></i> Save Community Settings</button>
                    </div>
                `;
                mainContent.innerHTML = html;
            }

            window.addValue = function() {
                const container = document.getElementById('valuesContainer');
                const index = communityData.values.length;
                const div = document.createElement('div');
                div.style.cssText =
                    'display:flex; gap:0.5rem; margin-bottom:0.5rem; align-items:center; background:#252536; padding:0.5rem 1rem; border-radius:1rem;';
                div.innerHTML = `
                    <input type="text" placeholder="fa-star" style="flex:0 0 100px; padding:0.4rem 0.6rem; border-radius:0.5rem; border:1px solid rgba(255,255,255,0.06); background:#1a1a28; color:#f0f0f0;" />
                    <input type="text" placeholder="Title" style="flex:1; padding:0.4rem 0.6rem; border-radius:0.5rem; border:1px solid rgba(255,255,255,0.06); background:#1a1a28; color:#f0f0f0;" />
                    <input type="text" placeholder="Description" style="flex:2; padding:0.4rem 0.6rem; border-radius:0.5rem; border:1px solid rgba(255,255,255,0.06); background:#1a1a28; color:#f0f0f0;" />
                    <button onclick="this.parentElement.remove()" style="background:rgba(255,59,48,0.1); border:none; color:#ff3b30; padding:0.3rem 0.8rem; border-radius:0.5rem; cursor:pointer;"><i class="fas fa-times"></i></button>
                `;
                container.appendChild(div);
            };

            window.removeValue = function(index) {
                communityData.values.splice(index, 1);
                renderCommunity();
            };

            window.saveCommunity = function() {
                const aboutText = document.getElementById('aboutText').value.trim();
                const branches = document.getElementById('statBranches').value.trim();
                const customers = document.getElementById('statCustomers').value.trim();
                const regions = document.getElementById('statRegions').value.trim();
                const rating = document.getElementById('statRating').value.trim();

                // Collect values from the DOM
                const valueElements = document.querySelectorAll('#valuesContainer > div');
                const values = [];
                valueElements.forEach(el => {
                    const inputs = el.querySelectorAll('input');
                    if (inputs.length === 3) {
                        values.push({ icon: inputs[0].value.trim() || 'fa-star', title: inputs[1].value.trim(),
                            desc: inputs[2].value.trim() });
                    }
                });

                const regionsInput = document.getElementById('regionsInput').value;
                const regionList = regionsInput.split(/[,|]\s*/).map(s => s.trim()).filter(s => s);

                communityData = {
                    aboutText,
                    stats: { branches, customers, regions, rating },
                    values,
                    regions: regionList
                };

                setStore('community', communityData);
                showToast('Community settings saved!');
                renderCommunity();
            };

            // ============================================================
            // 14. FAQ MANAGEMENT
            // ============================================================
            function renderFAQ() {
                let html = `
                    <div class="page-header">
                        <h2><i class="fas fa-question-circle"></i> FAQ</h2>
                        <div class="header-actions">
                            <button class="btn btn-primary" onclick="openFAQModal()"><i class="fas fa-plus"></i> Add FAQ</button>
                        </div>
                    </div>
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Question</th>
                                    <th>Answer</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                if (faqItems.length === 0) {
                    html += `
                        <tr>
                            <td colspan="4">
                                <div class="empty-state">
                                    <i class="fas fa-question-circle"></i>
                                    No FAQ items yet.
                                </div>
                            </td>
                        </tr>
                    `;
                } else {
                    faqItems.forEach(f => {
                        html += `
                            <tr>
                                <td>#${f.id}</td>
                                <td>${f.question}</td>
                                <td>${f.answer.substring(0, 50)}${f.answer.length > 50 ? '...' : ''}</td>
                                <td>
                                    <div class="actions">
                                        <button class="edit-btn" onclick="openFAQModal(${f.id})"><i class="fas fa-edit"></i></button>
                                            <button class="edit-btn" title="Edit FAQ" aria-label="Edit FAQ #${f.id}" onclick="openFAQModal(${f.id})"><i class="fas fa-edit"></i></button>
                                            <button class="delete-btn" title="Delete FAQ" aria-label="Delete FAQ #${f.id}" onclick="deleteFAQ(${f.id})"><i class="fas fa-trash"></i></button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    });
                }

                html += `</tbody></table></div>`;
                mainContent.innerHTML = html;
            }

            window.openFAQModal = function(id) {
                const isEdit = !!id;
                const faq = isEdit ? faqItems.find(f => f.id === id) : { id: 0, question: '', answer: '' };
                const title = isEdit ? 'Edit FAQ' : 'Add New FAQ';

                document.getElementById('modalTitle').textContent = title;
                document.getElementById('modalBody').innerHTML = `
                    <div class="form-group">
                        <label>Question</label>
                        <input type="text" id="fqQuestion" value="${isEdit ? faq.question : ''}" placeholder="How do I place an order?" />
                    </div>
                    <div class="form-group">
                        <label>Answer</label>
                        <textarea id="fqAnswer" rows="3" placeholder="Browse products, add to cart, and checkout.">${isEdit ? faq.answer : ''}</textarea>
                    </div>
                    <div class="modal-actions">
                        <button class="cancel-btn" onclick="closeModal()">Cancel</button>
                        <button class="save-btn" onclick="saveFAQ(${isEdit ? id : 0})">Save Changes</button>
                    </div>
                `;
                document.getElementById('modalOverlay').classList.add('active');
            };

            window.saveFAQ = function(id) {
                const question = document.getElementById('fqQuestion').value.trim();
                const answer = document.getElementById('fqAnswer').value.trim();

                if (!question || !answer) {
                    showToast('Please fill in both question and answer');
                    return;
                }

                if (id > 0) {
                    const index = faqItems.findIndex(f => f.id === id);
                    if (index !== -1) {
                        faqItems[index] = { ...faqItems[index], question, answer };
                        setStore('faq', faqItems);
                        showToast('FAQ updated!');
                    }
                } else {
                    faqItems.push({ id: getNextId(), question, answer });
                    setStore('faq', faqItems);
                    showToast('FAQ added!');
                }

                closeModal();
                renderPage('faq');
            };

            window.deleteFAQ = function(id) {
                if (confirm('Delete this FAQ?')) {
                    faqItems = faqItems.filter(f => f.id !== id);
                    setStore('faq', faqItems);
                    renderPage('faq');
                    showToast('FAQ deleted!');
                }
            };

            // ============================================================
            // 15. UTILITY FUNCTIONS
            // ============================================================
            window.closeModal = function() {
                document.getElementById('modalOverlay').classList.remove('active');
            };

            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
            document.getElementById('modalOverlay').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            // Close modal on Escape
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
            });

            function updateBadges() {
                document.getElementById('productCount').textContent = products.length;
                document.getElementById('sliderCount').textContent = slides.length;
                document.getElementById('branchCount').textContent = branches.length;
                document.getElementById('mediaCount').textContent = mediaItems.length;
                document.getElementById('popularCount').textContent = popularItems.length;
                document.getElementById('faqCount').textContent = faqItems.length;
            }

            function showToast(message) {
                const existing = document.querySelector('.custom-toast');
                if (existing) existing.remove();

                const toast = document.createElement('div');
                toast.className = 'custom-toast';
                toast.textContent = message;
                document.body.appendChild(toast);

                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transition = 'opacity 0.4s ease';
                    setTimeout(() => toast.remove(), 400);
                }, 3000);
            }

            // ============================================================
            // 16. INIT
            // ============================================================
            // Make functions globally accessible
            window.products = products;
            window.slides = slides;
            window.branches = branches;
            window.mediaItems = mediaItems;
            window.popularItems = popularItems;
            window.faqItems = faqItems;
            window.flipCards = flipCards;
            window.tickerItems = tickerItems;
            window.communityData = communityData;

            // Save stores when updated
            const originalSetStore = setStore;
            window.setStore = function(key, value) {
                originalSetStore(key, value);
                // Update global references
                if (key === 'products') products = value;
                if (key === 'slides') slides = value;
                if (key === 'branches') branches = value;
                if (key === 'media') mediaItems = value;
                if (key === 'popular') popularItems = value;
                if (key === 'faq') faqItems = value;
                if (key === 'flipcards') flipCards = value;
                if (key === 'ticker') tickerItems = value;
                if (key === 'community') communityData = value;
            };

            // Check auth on load
            checkAuth();

            console.log('Admin Dashboard loaded successfully!');
            console.log('Data stores initialized with LocalStorage.');
            console.log('Products:', products.length);
            console.log('Slides:', slides.length);
            console.log('Branches:', branches.length);
        })();
    </script>
</body>
</html>
